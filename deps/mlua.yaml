licenseSource: >-
  Sealed archives (registry-checksum-matched) + raw-bytes repo reads at
  tag v0.12.0, 2026-08-18 — details and sha256 pins inline in `license`.
  FINDING 2 — THE VENDORED-LUA QUESTION, stated explicitly (the record's
  core question): mlua supports BOTH arms — (a) VENDORED: feature
  `vendored` compiles a bundled Lua/Luau tree into the binary via
  lua-src/luau0-src; (b) SYSTEM: without `vendored`, mlua-sys pkg-config
  probes and links a system Lua (build/find_normal.rs, verified in the
  sealed sources). THE SANCTIONED ARM IS (a) VENDORED Lua 5.4 —
  spec-elected ("static-vendored", ES:16942 pin row; vendored Lua watched
  under the §48.3 vendored-C class, ES:17021; a system-Lua link would
  reintroduce exactly the version-indeterminism Part 43 rule-1 class
  problem the LibRaw record documents, and Lua-the-language's sandbox
  surface depends on the interpreter version being OURS). FEATURE FLAGS
  THAT SELECT THE SANCTIONED ARM, verbatim: features = ["lua54",
  "vendored"] — lua54 selects the 5.4 series (mlua-sys build/main.rs
  enforces exactly-one-of lua51/52/53/54/55/luajit/luau,
  compile_error otherwise, verified in sealed sources;
  build/find_vendored.rs maps lua54 → lua_src::Build::new().build(
  lua_src::Lua54) → the bundled lua-5.4.8 tree) and `vendored` selects
  arm (a). The 5.4-SERIES election is the spec's own §36.2 decision
  ("The vendored series stays 5.4 — Lua 5.5 exists upstream but the
  vendored series is a §36.2 decision, not a version bump" — spec-side
  record verbatim; lua-src 550.1.1 bundles 5.5.0 and mlua has a lua55
  feature, BOTH deliberately not elected).
  FINDING 3 — BUILD-EDGE SHIPPING (why this record needed generator
  wiring): lua-src is a BUILD-dependency of mlua-sys, so it resolves into
  the build/dev closure, NOT the shipped (normal-edge) graph — yet its
  vendored C payload IS compiled into the shipped binary by the mlua-sys
  build script. gen_notices' "tools, no text obligation" rule is
  therefore wrong for this crate's PAYLOAD (its first counterexample:
  freetype-sys-class vendoring crates are normal deps; lua-src is not).
  Closed mechanically in the same commit: vendoredTexts entries may
  declare `shipsViaBuildDep: true`, which lets activation and
  sha256-verified text extraction key on the build/dev closure (the
  tools-closure caption in the generated file carries the caveat). The
  entry below rides that extension.
  FINDING 4 — luajit-src co-resolves, never compiles: mlua-sys's
  `vendored` feature pulls BOTH lua-src and luajit-src (210.7.2+b925b3e,
  MIT, vendors LuaJIT) as optional build-deps; with lua54 elected the
  luajit tree is NEVER compiled (find_vendored.rs gates on feature
  luajit) — luajit-src is lock-resolved dead weight listed in the
  build/dev closure, no payload ships, no text obligation. luau0-src
  does NOT resolve at all without feature luau (probe-verified absent
  from the lock).
