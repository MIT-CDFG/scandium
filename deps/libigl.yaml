linkingKind: static
linking: >-
  EXTERNAL LINKED DEPENDENCY — never vendored, never ported
  (census verdict link_dont_vendor; obligations column verbatim: "Part 48
  dependency record; link as library or file-level MPL compliance if
  built from source; **never take files into `vendor/`**; keep away from
  the GPL subtree in any build"). CONSUMPTION-MECHANICS FINDING, recorded
  honestly and FLAGGED to O-INT (not papered): libigl is HEADER-ONLY by
  default — verified first-hand at the pin: public headers end with
  '#ifndef IGL_STATIC_LIBRARY / #include "<impl>.cpp"' (arap.h,
  min_quad_with_fixed.h read verbatim) and igl_inline.h defines
  IGL_INLINE=inline. The realistic consumption is a cpp shim TU in this
  tree that #includes <igl/arap.h> from an EXTERNAL PINNED CHECKOUT
  (fetched at build time, never committed), so the compiler incorporates
  libigl-derived object code into the shipped binary — mechanically
  COMPILE-TIME INCORPORATION (static-class), NOT a dynamic link. Why this
  is MPL-compliant without vendoring: MPL-2.0 copyleft is FILE-level
  (Covered Software = the source files; §3.3 Larger Work + §3.2
  executable-form distribution) — incorporating UNMODIFIED covered files
  into an executable is permitted provided the covered files' source form
  remains available (satisfied: public upstream at the pin, pointer
  carried in notices), notices are carried, and any modifications to the
  covered files themselves would be MPL (none — files are consumed
  unmodified from the pinned checkout; a patch requirement would force a
  record amendment). DIVERGENCE FLAG: the plan §1 rule-2 shorthand
  "link-don't-vendor" read literally (dynamic library boundary) is NOT
  what default upstream offers; the census obligations column itself
  already names the applicable arm — "file-level MPL compliance if built
  from source" — which is exactly the header-only mechanics. O-INT
  ratifies the reading at puppet-slice dispatch; if a literal dynamic
  boundary is wanted instead, adoption must elect IGL_STATIC_LIBRARY plus
  a shared-lib packaging shape (not audited at the pin — CMake audit is
  an adoption-time task) or a process boundary, a different engineering
  shape. Eigen is a pervasive dependency of the closure (<Eigen/Core,
  Sparse, Dense>) — Eigen needs its OWN dep record at adoption (MPL-2.0
  headers class, EIGEN_MPL2_ONLY election to exclude LGPL leftovers; same
  posture as the ceres record's Eigen note). Build guard on consumption:
  the shim must be provably unable to reach include/igl/copyleft/ (path
  excluded from the checkout or a grep gate on the shim's include
  closure). DD-① unsafe-location discipline applies to whatever C++/FFI
  seam is chosen.
