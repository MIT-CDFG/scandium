# appname spec artifact — generated-from: ENGINEERING-SPEC.md Part 40 §40.3 + §10.3 layer.*/mask.* family tables
# spec-version: 5.6   artifact-schema: appname.command-package.v1   authority: artifact
# rule: a PR changing normative behavior updates the document section, this artifact,
#       its tests, and generated docs IN THE SAME PR (Appendix I).
kind: layer.add
family: layer
schemaVersion: appname.command.LayerAdd.v1
title: Insert a new node; children order is bottom-to-top, index counts from the bottom, default = top
specRef:
- §10.3
- §40.3
class: R
inverse: delta
mergeKey: null
targetResolution: 'parent in params (§10.3: layer.add is the family exception - target block unused); parent
  MUST resolve to a Group/root -> error.command.target_kind_mismatch'
lockBehavior:
  pixels: irrelevant
  transparency: irrelevant
  position: irrelevant
  all: blocks
  note: ALL on the parent chain blocks insertion; others n/a (§40.3)
selectionBehavior: ignored by the engine; the UI convention "new adjustment layer masked by the selection"
  records as a following mask.add{from:'selection'} step
paramsSchema:
  $schema: https://json-schema.org/draft/2020-12/schema
  $id: https://appname.org/spec/command/LayerAdd.v1.json
  title: appname.command.LayerAdd.v1
  type: object
  required:
  - kind
  - newLayerId
  properties:
    kind:
      enum:
      - raster
      - group
      - adjustment
      - fill
      - text
      - shape
      - smart_object
    parent:
      type: string
      format: uuid
      description: 'default: root (§10.3); MUST resolve to a Group/root -> error.command.target_kind_mismatch'
    index:
      type: integer
      minimum: 0
      description: counts from the bottom; default len(parent.children) = top; clamps to 0..=len(parent.children)
        (documented clamp, not an error, §40.3)
    name:
      type: string
      description: 'default: localized per kind (§10.3)'
    kindParams:
      type: object
      description: 'open per-kind payload, re-validated recursively at stage 3 against the kind''s registry
        (§40.3): fill content §22, adjustment opKind + params §17 (unknown opKind -> error.schema.unknown_op_kind,
        §17.1), text/shape payloads §23/§20'
    newLayerId:
      type: string
      format: uuid
      description: client-generated creation UUID (§9.6); collision -> error.schema.duplicate_id
    newOpId:
      type: string
      format: uuid
      description: client-generated op UUID, required when kind:'adjustment' (§40.3/§9.6)
  additionalProperties: false
  allOf:
  - if:
      properties:
        kind:
          const: adjustment
      required:
      - kind
    then:
      required:
      - newOpId
defaults: {}
dirtyRect: 'D = new node bounds; adjustment/fill kinds: downstream ROI (§11.6; unmasked = full canvas, §9.6
  worked example) · T topic:"tree"'
events:
  history: always
  dirty: D
  tree: tree
historyLabel: history.layer.add
actionRecording: recordable; New Layer dialog (when invoked with dialog) captures committed params; replay
  rewrites layer targets by name-then-index (§26.1 rule 3); creation UUIDs replay identically - a second replay
  on the same document fails with error.schema.duplicate_id unless parameterized (§40.1 shared caveat)
scripting: appname.apply({kind:'layer.add', params:{kind:'raster', name:'Retouch', newLayerId:N}})
errors:
- error.api.*
- error.schema.missing_field
- error.command.unknown_kind
- error.schema.out_of_range
- error.schema.duplicate_id
- error.command.bad_target
- error.command.locked
- error.command.busy
- error.permission.*
- error.engine.panic
- error.engine.*
- error.command.target_kind_mismatch
- error.schema.unknown_op_kind
tests:
  quartet: full
  unit:
  - unit_cmd_layer_add_index_clamp
  - unit_cmd_layer_add_kind_params_recursion
  workflow: []
examples:
  validMinimal:
    schema: appname.command.v1
    id: 00000016-0000-4000-8000-000000000001
    kind: layer.add
    params:
      kind: raster
      newLayerId: feedfeed-0000-4000-8000-000000000001
  validMaximal:
    schema: appname.command.v1
    id: 00000016-0000-4000-8000-000000000002
    kind: layer.add
    params:
      kind: adjustment
      parent: ffffffff-0000-4000-8000-000000000001
      index: 0
      name: Curves 1
      newLayerId: feedfeed-0000-4000-8000-000000000001
      newOpId: feedfeed-0000-4000-8000-000000000002
      kindParams:
        opKind: adjustment.curves
        params:
          channels:
            master:
              points:
              - - 0.0
                - 0.0
              - - 1.0
                - 1.0
  invalid:
  - case: missing-required (no kind)
    payload:
      schema: appname.command.v1
      id: 00000016-0000-4000-8000-000000000003
      kind: layer.add
      params:
        newLayerId: feedfeed-0000-4000-8000-000000000001
    expectError: error.schema.missing_field
  - case: unknown-op-kind (kind:'adjustment' with an unregistered opKind, §17.1)
    payload:
      schema: appname.command.v1
      id: 00000016-0000-4000-8000-000000000004
      kind: layer.add
      params:
        kind: adjustment
        newLayerId: feedfeed-0000-4000-8000-000000000001
        newOpId: feedfeed-0000-4000-8000-000000000002
        kindParams:
          opKind: adjustment.nonexistent
    expectError: error.schema.unknown_op_kind
  - case: duplicate-id (newLayerId already present in an arena, §9.6)
    payload:
      schema: appname.command.v1
      id: 00000016-0000-4000-8000-000000000005
      kind: layer.add
      params:
        kind: raster
        newLayerId: aaaaaaaa-0000-4000-8000-000000000001
    expectError: error.schema.duplicate_id
  - case: target-kind-mismatch (parent resolves to a raster layer, not Group/root)
    payload:
      schema: appname.command.v1
      id: 00000016-0000-4000-8000-000000000006
      kind: layer.add
      params:
        kind: raster
        parent: aaaaaaaa-0000-4000-8000-000000000001
        newLayerId: feedfeed-0000-4000-8000-000000000001
    expectError: error.command.target_kind_mismatch
notes:
- errors = the §40.1 baseline set (first 11 entries, reachable from every kind, stages 0-6) followed by this
  kind's entry-specific MessageIds from Part 40; wildcards (error.api.*, error.permission.*, error.engine.*)
  are Appendix H family references.
- 'tests.quartet = the four §40.1 generated suites instantiated for every kind from the registry: prop_cmd_roundtrip[kind]
  (§34.4 property 7), prop_cmd_undo[kind] (§34.4 property 9/§10.4), replay_cmd_journal[kind] (§7.8/§10.6/§7.6),
  action_cmd_roundtrip[kind] (§26.1); per-kind lists below are the extras only.'
- 'Non-finite policy (§0.3/§40.1), inlined: numeric params arriving non-finite are never a validation error
  - NaN clamps to the field''s documented default, +/-Inf to the field''s documented min/max, every clamp
  recorded in the command-validation detail; error.schema.non_finite is reachable only on the write side (journal/action
  serialization), so it is not listed under errors.'
- 'undo: DeltaSet = AddNode TreeOp (subtree fragment per §7.3) - no tiles for parametric kinds (§40.3).'
- parent and index have dynamic defaults (root / len(parent.children)), so they are not in the defaults map.
