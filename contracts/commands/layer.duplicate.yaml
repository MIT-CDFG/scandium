# appname spec artifact — generated-from: ENGINEERING-SPEC.md Part 40 §40.3 + §10.3 layer.*/mask.* family tables
# spec-version: 5.6   artifact-schema: appname.command-package.v1   authority: artifact
# rule: a PR changing normative behavior updates the document section, this artifact,
#       its tests, and generated docs IN THE SAME PR (Appendix I).
kind: layer.duplicate
family: layer
schemaVersion: appname.command.LayerDuplicate.v1
title: Deep-copy a subtree; tiles COW-shared, new UUIDs throughout
specRef:
- §10.3
- §40.3
class: R
inverse: delta
mergeKey: null
targetResolution: target.layerId - the node acted on (§10.3 layer.* family rule); must resolve at stage 4
  (error.command.bad_target); lock resolution at stage 4 with transitive group locks, strictest wins (§11.1)
lockBehavior:
  pixels: irrelevant
  transparency: irrelevant
  position: irrelevant
  all: blocks
  note: ALL blocks on the source's ancestry (insertion mutates the parent); source-node PIXELS does not block
    (reading is free, §40.3)
selectionBehavior: ignored
paramsSchema:
  $schema: https://json-schema.org/draft/2020-12/schema
  $id: https://appname.org/spec/command/LayerDuplicate.v1.json
  title: appname.command.LayerDuplicate.v1
  type: object
  required:
  - idMap
  properties:
    newName:
      type: string
      description: 'default: source + localized " copy" (§10.3)'
    insertAbove:
      type: boolean
      default: true
    idMap:
      type: object
      additionalProperties:
        type: string
        format: uuid
      maxProperties: 16384
      description: 'RATIFIED wire key (§40.3, v5.1 — review action CMD-001): old-UUID -> new-UUID map, one entry
        per identity-bearing element of the source subtree (CLOSED set: layer nodes, their masks, their op-stack
        entries); canonical lowercase 8-4-4-4-12 both sides (§2.8); ≤ 16384 entries AND the §9.6 1-MiB envelope
        cap; canonical serialization sorts keys bytewise (replay equality is over the map); completeness ->
        error.schema.missing_field, unknown source keys -> error.schema.out_of_range, collisions/nil/max ->
        error.schema.duplicate_id / error.schema.out_of_range; action replay uses the recorded map verbatim
        (§26.1 rule 3 rewrites targets, never creation ids)' 
  additionalProperties: false
defaults:
  insertAbove: true
dirtyRect: D = duplicate bounds · T topic:"tree"
events:
  history: always
  dirty: D
  tree: tree
historyLabel: history.layer.duplicate
actionRecording: recordable; no dialog
scripting: appname.apply({kind:'layer.duplicate', target:{layerId:L}, params:{insertAbove:true, idMap:{L:N}}})
errors:
- error.api.*
- error.schema.missing_field
- error.command.unknown_kind
- error.schema.out_of_range
- error.schema.duplicate_id
- error.command.bad_target
- error.command.locked
- error.command.busy
- error.permission.*
- error.engine.panic
- error.engine.*
tests:
  quartet: full
  unit:
  - unit_cmd_layer_duplicate_cow (no tile copies until first edit)
  - unit_cmd_layer_duplicate_idmap (completeness/unknown-key/collision/nil matrix per §40.3 v5.1 rules)
  workflow: []
examples:
  validMinimal:
    schema: appname.command.v1
    id: 00000018-0000-4000-8000-000000000001
    kind: layer.duplicate
    target:
      layerId: aaaaaaaa-0000-4000-8000-000000000001
    params:
      idMap:
        aaaaaaaa-0000-4000-8000-000000000001: feedfeed-0000-4000-8000-000000000001
  validMaximal:
    schema: appname.command.v1
    id: 00000018-0000-4000-8000-000000000002
    kind: layer.duplicate
    target:
      layerId: aaaaaaaa-0000-4000-8000-000000000001
      maskId: null
      channelId: null
    params:
      newName: Sky copy
      insertAbove: false
      idMap:
        aaaaaaaa-0000-4000-8000-000000000001: feedfeed-0000-4000-8000-000000000001
        bbbbbbbb-0000-4000-8000-000000000001: feedfeed-0000-4000-8000-000000000002
  invalid:
  - case: duplicate-id (idMap maps onto a UUID already present in an arena)
    payload:
      schema: appname.command.v1
      id: 00000018-0000-4000-8000-000000000003
      kind: layer.duplicate
      target:
        layerId: aaaaaaaa-0000-4000-8000-000000000001
      params:
        idMap:
          aaaaaaaa-0000-4000-8000-000000000001: aaaaaaaa-0000-4000-8000-000000000001
    expectError: error.schema.duplicate_id
  - case: bad-target (source layerId does not resolve)
    payload:
      schema: appname.command.v1
      id: 00000018-0000-4000-8000-000000000004
      kind: layer.duplicate
      target:
        layerId: 0badbad0-0000-4000-8000-00000000dead
      params:
        idMap:
          aaaaaaaa-0000-4000-8000-000000000001: feedfeed-0000-4000-8000-000000000001
    expectError: error.command.bad_target
  - case: incomplete-idmap (a descendant mask id missing from the map)
    payload:
      schema: appname.command.v1
      id: 00000018-0000-4000-8000-000000000006
      kind: layer.duplicate
      target:
        layerId: aaaaaaaa-0000-4000-8000-000000000001
      params:
        idMap: {}
    expectError: error.schema.missing_field
  - case: unknown-source-key (map entry for an id outside the subtree)
    payload:
      schema: appname.command.v1
      id: 00000018-0000-4000-8000-000000000007
      kind: layer.duplicate
      target:
        layerId: aaaaaaaa-0000-4000-8000-000000000001
      params:
        idMap:
          aaaaaaaa-0000-4000-8000-000000000001: feedfeed-0000-4000-8000-000000000001
          0badbad0-0000-4000-8000-00000000beef: feedfeed-0000-4000-8000-000000000009
    expectError: error.schema.out_of_range
  - case: mistyped (insertAbove as string)
    payload:
      schema: appname.command.v1
      id: 00000018-0000-4000-8000-000000000005
      kind: layer.duplicate
      target:
        layerId: aaaaaaaa-0000-4000-8000-000000000001
      params:
        idMap:
          aaaaaaaa-0000-4000-8000-000000000001: feedfeed-0000-4000-8000-000000000001
        insertAbove: top
    expectError: error.schema.missing_field
notes:
- errors = the §40.1 baseline set (first 11 entries, reachable from every kind, stages 0-6) followed by this
  kind's entry-specific MessageIds from Part 40; wildcards (error.api.*, error.permission.*, error.engine.*)
  are Appendix H family references.
- 'tests.quartet = the four §40.1 generated suites instantiated for every kind from the registry: prop_cmd_roundtrip[kind]
  (§34.4 property 7), prop_cmd_undo[kind] (§34.4 property 9/§10.4), replay_cmd_journal[kind] (§7.8/§10.6/§7.6),
  action_cmd_roundtrip[kind] (§26.1); per-kind lists below are the extras only.'
- 'Non-finite policy (§0.3/§40.1), inlined: numeric params arriving non-finite are never a validation error
  - NaN clamps to the field''s documented default, +/-Inf to the field''s documented min/max, every clamp
  recorded in the command-validation detail; error.schema.non_finite is reachable only on the write side (journal/action
  serialization), so it is not listed under errors.'
- 'validates (§40.3): id-map completeness - one fresh UUID per node/mask/op in the source subtree, none colliding
  -> error.schema.duplicate_id.'
- 'undo: AddNode TreeOp of the copy; tiles COW-shared with the source (§10.3), so the delta holds structure
  only.'
