# appname spec artifact — generated-from: ENGINEERING-SPEC.md Part 40 §40.3 + §10.3 layer.*/mask.* family tables
# spec-version: 5.6   artifact-schema: appname.command-package.v1   authority: artifact
# rule: a PR changing normative behavior updates the document section, this artifact,
#       its tests, and generated docs IN THE SAME PR (Appendix I).
kind: layer.ungroup
family: layer
schemaVersion: appname.command.LayerUngroup.v1
title: Dissolve a group, splicing children into the parent at the group's position
specRef:
- §10.3
- §40.3
class: R
inverse: delta
mergeKey: null
targetResolution: target.layerId - the node acted on (§10.3 layer.* family rule); must resolve at stage 4
  (error.command.bad_target); lock resolution at stage 4 with transitive group locks, strictest wins (§11.1);
  target MUST be a Group -> error.command.target_kind_mismatch
lockBehavior:
  pixels: irrelevant
  transparency: irrelevant
  position: irrelevant
  all: blocks
  note: ALL blocks (group or ancestry) (§40.3)
selectionBehavior: ignored
paramsSchema:
  $schema: https://json-schema.org/draft/2020-12/schema
  $id: https://appname.org/spec/command/LayerUngroup.v1.json
  title: appname.command.LayerUngroup.v1
  type: object
  description: 'no params (§10.3 row: ''-''); stage 3 rejects any field (baseline: extra field -> error.schema.missing_field)'
  properties: {}
  additionalProperties: false
defaults: {}
dirtyRect: D = union of child bounds when the group carried masks/effects/isolation or non-Normal blend/opacity,
  else none · T topic:"tree"
events:
  history: always
  dirty: D
  tree: tree
  note: D conditional - only when the splice changes compositing (§40.3)
historyLabel: history.layer.ungroup
actionRecording: recordable; no dialog
scripting: appname.apply({kind:'layer.ungroup', target:{layerId:G}})
errors:
- error.api.*
- error.schema.missing_field
- error.command.unknown_kind
- error.schema.out_of_range
- error.schema.duplicate_id
- error.command.bad_target
- error.command.locked
- error.command.busy
- error.permission.*
- error.engine.panic
- error.engine.*
- error.command.target_kind_mismatch
tests:
  quartet: full
  unit:
  - unit_cmd_layer_ungroup_composite_change (masked group splice reflows pixels)
  workflow: []
examples:
  validMinimal:
    schema: appname.command.v1
    id: 00000021-0000-4000-8000-000000000001
    kind: layer.ungroup
    target:
      layerId: ffffffff-0000-4000-8000-000000000001
  validMaximal:
    schema: appname.command.v1
    id: 00000021-0000-4000-8000-000000000002
    kind: layer.ungroup
    target:
      layerId: ffffffff-0000-4000-8000-000000000001
      maskId: null
      channelId: null
    params: {}
  invalid:
  - case: target-kind-mismatch (target resolves to a raster layer, not a Group)
    payload:
      schema: appname.command.v1
      id: 00000021-0000-4000-8000-000000000003
      kind: layer.ungroup
      target:
        layerId: aaaaaaaa-0000-4000-8000-000000000001
    expectError: error.command.target_kind_mismatch
  - case: bad-target (layerId does not resolve)
    payload:
      schema: appname.command.v1
      id: 00000021-0000-4000-8000-000000000004
      kind: layer.ungroup
      target:
        layerId: 0badbad0-0000-4000-8000-00000000dead
    expectError: error.command.bad_target
  - case: extra-param (the row has no params)
    payload:
      schema: appname.command.v1
      id: 00000021-0000-4000-8000-000000000005
      kind: layer.ungroup
      target:
        layerId: ffffffff-0000-4000-8000-000000000001
      params:
        keepMasks: true
    expectError: error.schema.missing_field
notes:
- errors = the §40.1 baseline set (first 11 entries, reachable from every kind, stages 0-6) followed by this
  kind's entry-specific MessageIds from Part 40; wildcards (error.api.*, error.permission.*, error.engine.*)
  are Appendix H family references.
- 'tests.quartet = the four §40.1 generated suites instantiated for every kind from the registry: prop_cmd_roundtrip[kind]
  (§34.4 property 7), prop_cmd_undo[kind] (§34.4 property 9/§10.4), replay_cmd_journal[kind] (§7.8/§10.6/§7.6),
  action_cmd_roundtrip[kind] (§26.1); per-kind lists below are the extras only.'
- 'Non-finite policy (§0.3/§40.1), inlined: numeric params arriving non-finite are never a validation error
  - NaN clamps to the field''s documented default, +/-Inf to the field''s documented min/max, every clamp
  recorded in the command-validation detail; error.schema.non_finite is reachable only on the write side (journal/action
  serialization), so it is not listed under errors.'
- group masks/effects are discarded by the splice - compositing may change (§40.3).
- 'undo: MoveNode per child + RemoveNode (group), reversed on undo.'
