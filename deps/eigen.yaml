notes: >-
  Prepared record-first for the warps row per the O-INT rider (this
  record + the libigl record form one READY unit for the O-TOOLS warps
  builder). SUPERSESSION MIRROR: if the own-Rust ARAP solve is elected
  at the puppet slice instead of libigl (the census dossier's primary
  plan — both routes stand recorded in the libigl record), THIS record
  is superseded together with libigl's and no obligation fires (the
  ceres alternative-clause precedent). VERSION POSTURE: the libigl
  census pin is a post-v2.5.0 main-line commit whose Eigen requirement
