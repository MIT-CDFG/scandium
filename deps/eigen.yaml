  the upstream-sanctioned tripwire should a checkout drift or a future
  tag reintroduce guarded code).
guardMechanics: >-
  EIGEN_MPL2_ONLY, traced first-hand at the tag. The guard file
  Eigen/src/Core/util/NonMPL2.h is three lines, verbatim: "#ifdef
  EIGEN_MPL2_ONLY / #error Including non-MPL2 code in EIGEN_MPL2_ONLY
  mode / #endif". It is #included by EXACTLY the two LGPL files (both
  unsupported/Eigen/src/IterativeSolvers/) and nothing else — so with
  -DEIGEN_MPL2_ONLY defined, compiling either LGPL file is a hard
  compile error, exactly as COPYING.README states ("This will cause a
  compilation error to be generated if you #include any code that is
  LGPL licensed"). PRECISION FINDING, stated so nobody over-reads the
  define: the guard is an LGPL TRIPWIRE ONLY, not a general non-MPL2
  excluder — it does NOT fire for the Apache-2.0 file, the Intel BSD-3
  files, or the Minpack files (consistent with COPYING.README's own
  framing: the define guarantees "MPL2 and possibly more permissive
  licenses (like BSD)"). Permissive-license carriage is therefore NOT
  dischargeable by the define; it is handled by the obligations below.
licenseElected: >-
  MPL-2.0 (link-don't-vendor class per deps/README.md policy; files
  never enter this tree) for the core headers, under the SANCTIONED
  CONSUMPTION SHAPE: (1) -DEIGEN_MPL2_ONLY REQUIRED on every TU that
  compiles Eigen headers (build-system enforced on the shim; a grep gate
  on the shim's build flags at consumption); (2) unsupported/ EXCLUDED
  entirely (path excluded from the pinned checkout or an include-closure
  grep gate — the same guard shape as libigl's copyleft/ exclusion; this
  is what actually keeps LGPL and Minpack code out, the define being the
  backstop); (3) EIGEN_USE_BLAS / EIGEN_USE_LAPACKE / EIGEN_USE_MKL*
  NOT defined (keeps the conditional Intel-BSD bridge files out of the
  closure). Residual in-closure non-MPL2 carriage elected: Apache-2.0
  (BFloat16.h) + BSD-3-Clause (MKL_support.h) — both unconditional
  includes of Eigen/Core, both permissive, notices carried on
  consumption per obligations.
upstream: 'https://eigen.tuxfamily.org (source gitlab.com/libeigen/eigen)'
linkingKind: static
linking: >-
  EXTERNAL LINKED DEPENDENCY, header-only PURE — never vendored, never
  ported. Eigen ships NO compiled library at all (no .cpp in the library
  proper; simpler than libigl's optional IGL_STATIC_LIBRARY shape): the
  only consumption mechanics is compile-time incorporation of covered
  header files into the including TU. GOVERNING ARM: the O-INT
  consumption-mechanics ruling 2026-08-17 (reports/INTEGRATION-log.md,
  libigl record merge) — "FILE-LEVEL MPL COMPLIANCE VIA THE CPP SHIM
  from the pinned external checkout … unmodified covered files into a
  Larger Work, source availability via the public pin, notices carried",
  with the plan §1 rule-2 "link-don't-vendor" shorthand fold-in-noted as
  superseded-by-census-arm for header-only libraries. This record RIDES
  that ruling — Eigen headers are compiled into the very same shim TU
  that compiles the libigl ARAP headers, from an external pinned
  checkout fetched at build time and never committed; MPL-2.0 copyleft
  is file-level (§3.3 Larger Work + §3.2 executable-form distribution),
  satisfied by unmodified consumption + public source availability at
  the pin + notice carriage. Any local modification to a covered file
  would be MPL-governed and forces a record amendment (none — files are
  consumed unmodified).
usedBy: >-
  the O-TOOLS libigl ARAP cpp shim TU ONLY (transform.puppet, CP-1.0
  warps row) — Eigen is libigl's required substrate, not a direct
  Appname API. No consumer exists in the tree today.
preAuthorizedFor: >-
  nothing yet — approved-unconsumed; activation = the O-TOOLS puppet
