  workflow: []
examples:
  validMinimal:
    schema: appname.command.v1
    id: 00000009-0000-4000-8000-000000000001
    kind: doc.depth_convert
    params:
      to: u16
  validMaximal:
    schema: appname.command.v1
    id: 00000009-0000-4000-8000-000000000002
    kind: doc.depth_convert
    target:
      layerId: null
      maskId: null
      channelId: null
    params:
