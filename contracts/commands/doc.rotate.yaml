# appname spec artifact — generated-from: ENGINEERING-SPEC.md Part 40 §40.2 + §10.3 doc.* family table
# spec-version: 5.6   artifact-schema: appname.command-package.v1   authority: artifact
# rule: a PR changing normative behavior updates the document section, this artifact,
#       its tests, and generated docs IN THE SAME PR (Appendix I).
kind: doc.rotate
family: doc
schemaVersion: appname.command.DocRotate.v1
title: Rotate the entire canvas; 90-degree multiples MUST be a lossless pixel permutation
specRef:
- §10.3
- §40.2
class: R
inverse: delta
mergeKey: null
targetResolution: applied through the document handle; the target block is ignored (§10.3 doc.* family rule)
  - no target field resolves
lockBehavior:
  pixels: irrelevant
  transparency: irrelevant
  position: irrelevant
  all: irrelevant
  note: none - document scope (§40.2 family rule)
selectionBehavior: 'carried (§40.2 geometry-kind family rule): the selection mask (and every mask/channel
  surface) is resampled/translated/cropped with the canvas inside the same DeltaSet, so undo restores pixels
  and selection together; the mask edit is recorded under the selection-surface UUID (§10.1); permuted/resampled
  with the canvas'
paramsSchema:
  $schema: https://json-schema.org/draft/2020-12/schema
  $id: https://appname.org/spec/command/DocRotate.v1.json
  title: appname.command.DocRotate.v1
  type: object
  required:
  - angleDeg
  properties:
    angleDeg:
      type: number
      minimum: -360
      maximum: 360
      description: degrees (§0.3); angles congruent 0 (mod 90) MUST take the lossless permutation path - bit-identical
        channel values, no resample (§10.3)
    flipH:
      type: boolean
      default: false
      description: lossless pixel permutation, combinable with angleDeg:0
    flipV:
      type: boolean
      default: false
      description: lossless pixel permutation, combinable with angleDeg:0
    expand:
      type: boolean
      default: true
      description: true swaps/inflates dimensions
    resample:
      enum:
      - nearest
      - bilinear
      - bicubic
      - bicubic_smoother
      - bicubic_sharper
      - lanczos
      default: bicubic
      description: non-right angles only; §18.2 kernel set (§10.3 prints only the default - see notes)
  additionalProperties: false
defaults:
  flipH: false
  flipV: false
  expand: true
  resample: bicubic
dirtyRect: D [0,0,w',h'] (expand:true swaps/inflates dimensions) · T topic:"tree"
events:
  history: always
  dirty: D
  tree: tree
historyLabel: history.doc.rotate
actionRecording: recordable; Rotate Canvas dialog (arbitrary angle) captures committed params; 90/180-degree
  menu items record with no dialog
scripting: appname.apply({kind:'doc.rotate', params:{angleDeg:90}})
errors:
- error.api.*
- error.schema.missing_field
- error.command.unknown_kind
- error.schema.out_of_range
- error.schema.duplicate_id
- error.command.bad_target
- error.command.locked
- error.command.busy
- error.permission.*
- error.engine.panic
- error.engine.*
tests:
  quartet: full
  unit:
  - unit_cmd_doc_rotate_right_angle_lossless (4x90deg returns byte-identical tiles)
  - unit_cmd_doc_rotate_flip_composition
  workflow: []
examples:
  validMinimal:
    schema: appname.command.v1
    id: 00000007-0000-4000-8000-000000000001
    kind: doc.rotate
    params:
      angleDeg: 90
  validMaximal:
    schema: appname.command.v1
    id: 00000007-0000-4000-8000-000000000002
    kind: doc.rotate
    target:
      layerId: null
      maskId: null
      channelId: null
    params:
      angleDeg: -360
      flipH: true
      flipV: true
      expand: false
      resample: lanczos
  invalid:
  - case: out-of-range (angleDeg 400 outside -360..=360)
    payload:
      schema: appname.command.v1
      id: 00000007-0000-4000-8000-000000000003
      kind: doc.rotate
      params:
        angleDeg: 400
    expectError: error.schema.out_of_range
  - case: missing-required (no angleDeg)
    payload:
      schema: appname.command.v1
      id: 00000007-0000-4000-8000-000000000004
      kind: doc.rotate
      params:
        flipH: true
    expectError: error.schema.missing_field
  - case: mistyped (flipH as string)
    payload:
      schema: appname.command.v1
      id: 00000007-0000-4000-8000-000000000005
      kind: doc.rotate
      params:
        angleDeg: 0
        flipH: 'yes'
    expectError: error.schema.missing_field
notes:
- errors = the §40.1 baseline set (first 11 entries, reachable from every kind, stages 0-6) followed by this
  kind's entry-specific MessageIds from Part 40; wildcards (error.api.*, error.permission.*, error.engine.*)
  are Appendix H family references.
- 'tests.quartet = the four §40.1 generated suites instantiated for every kind from the registry: prop_cmd_roundtrip[kind]
  (§34.4 property 7), prop_cmd_undo[kind] (§34.4 property 9/§10.4), replay_cmd_journal[kind] (§7.8/§10.6/§7.6),
  action_cmd_roundtrip[kind] (§26.1); per-kind lists below are the extras only.'
- 'Non-finite policy (§0.3/§40.1), inlined: numeric params arriving non-finite are never a validation error
  - NaN clamps to the field''s documented default, +/-Inf to the field''s documented min/max, every clamp
  recorded in the command-validation detail; error.schema.non_finite is reachable only on the write side (journal/action
  serialization), so it is not listed under errors.'
- 'undo: right angles/flips -> permutation recorded as full-surface tile deltas (COW-cheap since after tiles
  are fresh Arcs); arbitrary angles -> resampled tile deltas + geometry props (§40.2).'
- 'resample: value set inherited from the §18.2 kernel enum published in the doc.resize row (the §10.3 row
  prints only the default) - inheritance noted, not invented.'
