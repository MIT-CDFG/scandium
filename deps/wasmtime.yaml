  gracefully; plugin load attempts fail with the §25 ABI/permission error
  surface, never a crash.
reviewOwner: build
risk: >-
  medium — a JIT runtime executing untrusted code is the workspace's
  single largest attack-surface addition (mitigations are the spec's own:
  capability gates + no-preopen WASI default + §34 permission tests +
  Critical-SLA advisory watch + tier-off fallback); license posture
  itself is LOW (permissive-with-exception, single expression, texts
  byte-identical crate↔tag; the one GPL-family dual in the default graph
  is disclosed, elected to its BSD arm, and avoidable outright via the
  trimmed feature set). Watch items: monthly-major cadence vs the exact
  pin (every bump = fresh record touch), the ittapi feature-trim landing
  as recommended, the allow-jit packaging note.
