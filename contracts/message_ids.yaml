# appname spec artifact — generated-from: ENGINEERING-SPEC.md Appendix G (+ every § naming a MessageId; Parts 38–52 "New MessageIds" tables)
# spec-version: 5.6   artifact-schema: appname.messageid-registry.v1   authority: artifact
# rule: a PR changing normative behavior updates the document section, this artifact,
#       its tests, and generated docs IN THE SAME PR (Appendix I).
#
# Registry seed: every MessageId the spec names, extracted mechanically (backticked
# `area.segment…` ids over the 12 Appendix G areas; wildcard/family patterns like
# `error.io.*` are families, not ids, and are excluded). The msgid-registry-check
# (CI stage 1, §33.2) fails on any unregistered, removed, or re-purposed id;
# new ids arrive via the §36.5 PR i18n note and freeze at T−14 (§33.6 step 1).
rules:
  specRef: Appendix G
  naming:
  - lowercase ASCII letters, digits, and underscores; segments joined by dots in the shape area.context.key (deeper
    contexts allowed, e.g. tool.crop.option.delete_cropped)
  - no abbreviations inside context/key segments — background, not bg; the twelve area prefixes are fixed tokens
    and the only sanctioned short forms
  - an id names the meaning, not the current wording; rewording a string never changes its id
  - one id per rendered string — no runtime concatenation of fragments (§27.1); a command kind's history label is
    history.<kind> (§10.1)
  stability: '[NORMATIVE] an id that has shipped in a stable release is never renamed, renumbered into another area,
    or re-purposed; replacement = add a new id and keep the old one as a deprecated alias (registry entry gains
    deprecated + replacedBy); deprecated ids may be dropped no earlier than the next major version, with a migration
    note (Appendix G)'
  pluralsAndGenders: 'grammar lives in the catalog value, never in the id: ICU MessageFormat plural/select in the
    translation; variant ids (…_one, …_many, …_fem) are forbidden (Appendix G)'
  areas:
  - app
  - menu
  - tool
  - panel
  - dialog
  - error
  - history
  - filter
  - adjustment
  - pref
  - a11y
  - unit
  statusVocabulary:
    shipped-v1: named by the v1 spec surface (Parts 0–37 + appendices); ships with 1.0
    reserved: named by the spec only in a Post-1.0/reserved context; registered, not shipped
    new-v3: introduced by a Parts 38–52 'New MessageIds' table (v3.0 additions)
  familiesExcluded: wildcard/family patterns (e.g. error.io.*, dialog.recovery.* as a family reference) are namespaces,
    not ids — members are registered individually
