bindingCensus: >-
  RECORD-LEVEL FINDING 2 (crates.io census, first-hand via the registry
  API with UA, 2026-08-17 — CORRECTED at ratification: the O-IO draft's
  basis "every crates.io LibRaw binding is abandoned at wraps <= 0.20.1"
  was INCOMPLETE; the full census is below, and the draft's CONCLUSION
  survives it, stronger). The spec-side record's "usedBy: appname-io via
  libraw-sys" cannot mean the crates.io `libraw-sys` crate:
  (1) libraw-sys max 0.1.1 + libraw (wrapper) max 0.1.1 — MIT, published
  2015-11-05, abandoned a decade.
  (2) libraw-rs max 0.0.4 / libraw-rs-sys max 0.0.4+libraw-0.20.1 —
  MIT/Apache-2.0, 2021-02-02, wraps 0.20.1 != our 0.22.1 pin.
  (3) NEW vs draft — rsraw / rsraw-sys 0.1.1 (MIT, latest publish
  2026-03-21): a LIVE binding, but DISQUALIFIED on posture, verified from
  the sealed rsraw-sys-0.1.1.crate (sha256
  e94485be17b6f6eab181abfcc378d7ccc1efc070c4e87cae3a0e75f110e8b754 ==
  registry checksum): it VENDORS a full LibRaw 0.21.3 source tree inside
  the .crate and cc-compiles it into a STATIC library (build.rs:
  cc::Build …compile("raw"); "cargo:rustc-link-lib=static=raw") —
  vendored-source static linking violates this record's LGPL §6
  replaceable-dylib rule outright, wraps 0.21.3 != 0.22.1, and the crate
  self-declares `MIT` while shipping the LGPL/CDDL LibRaw tree (a
  license-metadata mislabel; independent disqualifier).
  (4) NEW vs draft — libraw_rs_vendor 1.0.0 (LGPL-2.1-only OR CDDL-1.0,
  2023-08-08): vendored LibRaw 0.21.1 — same disqualified class.
  (5) Excluded non-bindings: rawlib (thumbnail-extractor tool, no
  repository link), rawler (pure-Rust decoder, not a LibRaw binding),
  librawssg/librawdist (static-site-generator ecosystem — name collision
  only).
  CONCLUSION: no crates.io crate offers a maintained DYNAMIC-LINK binding
  at 0.22.1; every live candidate is vendored-source/static and posture-
  violating. BINDING POSTURE at consumption: an OWN in-workspace
  `libraw-sys` facade crate (components block above). SUPERSESSION SCOPE,
  NARROWED at ratification: the own facade is not a divergence from the
  spec — it IS the spec's own architecture (ES §1.4 places `libraw-sys`
  in the in-tree sys/ directory: crate map ES:627/ES:820, deny stanza
  ES:934, check-arch ES:972). What is superseded is only the spec-side
  DEPS-RECORD prose, which is ambiguous enough to be misread as the
  crates.io crate — see the fold-in note in `notes`. Zero third-party
  binding crates enter the graph.
packagingChannel: >-
  GAP, recorded — NARROWED at ratification (the O-IO draft said neither
  ES Part 48 nor the spec-side record names where the shipped dylib comes
  from; first-hand spec reads 2026-08-17 show the channel is CONSTRAINED
  though not decided): Part 43 determinism rule 1 [NORMATIVE] (ES:15593)
  — "LibRaw is version-pinned and vendored (§36.2); its build flags are
  fixed in-repo; a LibRaw upgrade is an engine-version change" (non-Bayer
  goldens pin the LibRaw version doubly); §36.2 supply-chain rules
  (ES:11302) — vendored C sources pinned to an upstream release tag with
  archive SHA-256 recorded and verified at build time, release artifacts
  build from a vendored source archive; ES §1.4 rule 2 (ES:909) — LGPL
  libraries prefer a system library. REMAINING for the dmg/packaging wave
  to decide and record HERE before any artifact ships: (a) the concrete
  channel (build the pinned, sha256-recorded 0.22.1 source archive into
  the replaceable dylib at packaging vs a pinned official binary — noting
  upstream ships no macOS dylib) + source + hash of the shipped dylib;
  (b) the SPEC-INTERNAL TENSION between §1.4 rule 2's system-library
  preference and Part 43 rule 1's pinned-version determinism (an
  arbitrary system libraw breaks the doubly-pinned non-Bayer goldens) —
  this record's posture treats the [NORMATIVE] determinism pin as
  controlling (ship our own pinned replaceable dylib; LGPL §6 user
  substitution remains possible and voids determinism claims, which is
  exactly what §6 protects); flagged for O-INT/fold-in, not resolved
  unilaterally here. USE_DNGSDK stays OFF absent a fresh record touch
  (finding 1d).
dmgWaveDecision: >-
  CP-1.0 dmg wave — the channel decision packagingChannel item (a)/(b)
  delegates to this wave ("decide and record HERE"). DECISION (O-BUILD,
  2026-08-18): ship our OWN pinned, sha256-recorded LibRaw 0.22.1 built
  from the vendored upstream source archive (§36.2 vendored-source rules:
  pinned upstream tag b860248a…, archive SHA-256 verified at build time)
  into the app bundle as a REPLACEABLE dynamic library
  (Contents/Frameworks, install_name @executable_path/../Frameworks,
  the Qt-LGPL-framework macdeployqt pattern) — NOT a system link, NOT
  static, NOT vendored-into the GPL-3.0-only binary. REASONING for the
  §1.4-rule-2-vs-Part-43-rule-1 tension: Part 43 determinism rule 1 is
  [NORMATIVE] and controlling; §1.4 rule 2 ("prefer a system library") is
  a soft preference, not normative, and yields when it conflicts with a
  normative rule. An arbitrary system libraw of unknown version breaks the
  doubly-pinned non-Bayer goldens; the dmg MUST ship the pinned 0.22.1.
  LGPL-2.1 §6 relink-ability is preserved BY the replaceable-dylib form:
  a user may substitute their own libraw (which voids the determinism
  guarantee — exactly what §6 protects). upstream ships no macOS dylib, so
  build-from-pinned-source at packaging is the only channel that is both
  version-exact and §6-compliant. STATUS: DEFERRED-ACTIVE — no dylib is
  wired into scripts/build_dmg.sh yet because RAW is approved-unconsumed
  (facade TO BE CREATED by O-IO; RawCodec::decode is typed-NI today, so no
  libraw dylib exists to ship). This decision governs the moment O-IO's
  binding slice (preAuthorizedFor) lands; build_dmg.sh gains the
  Frameworks-stage + build-time archive-hash verification then, and the
  dylib provenance row + NOTICE activation (obligations) fire in the same
  commit. The SPEC-INTERNAL §1.4-vs-Part-43 prose tension remains an
  O-INT/v5.6 fold-in (the record's notes) — this field records only the
  BUILD-side channel call the wave was asked to make, and does NOT touch
  the linking posture, the LGPL election, or the egress/clean-room posture.
