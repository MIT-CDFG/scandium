shareAlikeWorkflow: >-
  Obligation shape from the license terms read first-hand, three
  distinct cases. (1) SHIPPED UNMODIFIED (current state): the db is the
  Work incorporated in a Collection — §4(a) requires the license copy
  with every distributed copy (the co-located COPYING, sha-verified) and
  all notices kept intact (byte-identical carriage, payload-pinned);
  §4(a)'s Collection carve-out keeps the application itself outside
  CC-BY-SA terms. (2) SHIPPED MODIFIED (any project change to the staged
  db): an Adaptation — §4(b) requires CC-BY-SA-3.0 (or listed
  compatible) distribution with license carriage, §3(b) requires the
  changes clearly marked; the PROJECT WORKFLOW (elected, per the census
  obligations row — upstreaming exceeds the license's distribution-terms
  minimum) is contribute the modification back upstream, mark it, and
  amend THIS record (payloadSha256 + this field) in the same commit —
  mechanically enforced: gen_notices re-hashes the staged payload every
  run, so a shipped-db change without a record amendment is a red gate.
  (3) USER-DIR CONTENTS: share-alike attaches on distribution; profiles
  a user adds or modifies in their own user-replaceable directory are
  not distributed by the project — the user's affair, no project
  obligation arises; the reader treats that dir as untrusted input
  (typed errors, never panics).
stagedDirContract: >-
  data/lensfun-db/ is the SHIPPED database staging area. Election
  recorded: a NEW top-level data/ directory, not packs/ — packs/ is
  O-ML model-pack territory with its own manifest-verification +
  license-display mechanics (D-49); profile DATA is not a model pack and
  must not inherit pack semantics — and not inside any crate (the data
  is not code and no crate owns it; O-BUILD fence). Layout: db/ (the
  payload, byte-identical to the census pin, manifest-pinned) +
  COPYING.CC_BY-SA_3.0 (the license travels with the data, not the
  application binary) + README.md (basis + obligation shape + workflow
  note, project-authored). Packaging (dmg wave, CP-1.0 release row):
  ship this directory as the application's read-only default profile
  source. Runtime (O-INT ruling 2026-08-17, split by data class): the
  shipped dir is read STRICTLY — all-or-nothing, corruption of what we
  ship fails loud; the USER-REPLACEABLE dir is an OS-user-location
  override OUTSIDE this repo, wrapped degrade-to-warnings-and-skip at
  the O-IO consumer seam. The reader consumes whatever directory it is
  handed; the split lives at the consumer, not in reader semantics.
noticeSurfaces:
