name: Eigen
role: >-
  header-only C++ linear-algebra substrate REQUIRED BY LIBIGL — the ARAP
  include closure of the transform.puppet backend (plan §2.5 warps row)
  pervasively includes <Eigen/Core>, <Eigen/Sparse>, <Eigen/Dense> (the
  libigl record's closure finding). No direct Appname consumer exists or
  is sanctioned: Eigen enters exactly one place, the O-TOOLS cpp shim TU
  that compiles the libigl ARAP headers. Everything Rust-side stays on
  own math types (nalgebra-free workspace; no Rust Eigen binding).
