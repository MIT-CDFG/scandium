kind: layer.rename
family: layer
schemaVersion: appname.command.LayerRename.v1
title: Rename a node
specRef:
- §10.3
- §40.3
class: R
inverse: param
mergeKey: null
targetResolution: target.layerId - the node acted on (§10.3 layer.* family rule); must resolve at stage 4
  (error.command.bad_target); lock resolution at stage 4 with transitive group locks, strictest wins (§11.1)
lockBehavior:
  pixels: irrelevant
  transparency: irrelevant
  position: irrelevant
  all: blocks
  note: ALL blocks; others n/a (§40.3)
selectionBehavior: ignored
paramsSchema:
  $schema: https://json-schema.org/draft/2020-12/schema
  $id: https://appname.org/spec/command/LayerRename.v1.json
  title: appname.command.LayerRename.v1
  type: object
  required:
  - name
  properties:
    name:
      type: string
      minLength: 1
      maxLength: 255
      description: 1..=255 Unicode scalar values -> error.schema.out_of_range; layer names are user content
        - never logged (§1.6)
  additionalProperties: false
defaults: {}
dirtyRect: no D · T topic:"tree" (kind:"props" tree event, §9.5)
events:
  history: always
  dirty: null
  tree: tree
historyLabel: history.layer.rename
actionRecording: recordable; no dialog; renames change the name that rule-3 target rewriting matches - actions
  recorded before a rename fall back to tree-index resolution (§40.3)
scripting: appname.apply({kind:'layer.rename', target:{layerId:L}, params:{name:'Sky'}})
errors:
- error.api.*
- error.schema.missing_field
- error.command.unknown_kind
- error.schema.out_of_range
- error.schema.duplicate_id
- error.command.bad_target
- error.command.locked
- error.command.busy
- error.permission.*
- error.engine.panic
- error.engine.*
tests:
  quartet: full
  unit:
  - unit_cmd_layer_rename_replay_fallback (rename mid-action -> index fallback)
  workflow: []
examples:
  validMinimal:
    schema: appname.command.v1
    id: 00000022-0000-4000-8000-000000000001
    kind: layer.rename
    target:
      layerId: aaaaaaaa-0000-4000-8000-000000000001
    params:
      name: Sky
  validMaximal:
    schema: appname.command.v1
    id: 00000022-0000-4000-8000-000000000002
    kind: layer.rename
    target:
      layerId: aaaaaaaa-0000-4000-8000-000000000001
      maskId: null
      channelId: null
    params:
      name: nnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnn
  invalid:
  - case: out-of-range (empty name, minLength 1)
    payload:
      schema: appname.command.v1
      id: 00000022-0000-4000-8000-000000000003
      kind: layer.rename
      target:
        layerId: aaaaaaaa-0000-4000-8000-000000000001
      params:
        name: ''
    expectError: error.schema.out_of_range
  - case: missing-required (no name)
    payload:
      schema: appname.command.v1
      id: 00000022-0000-4000-8000-000000000004
      kind: layer.rename
      target:
        layerId: aaaaaaaa-0000-4000-8000-000000000001
      params: {}
    expectError: error.schema.missing_field
  - case: locked (ALL lock on the node)
    payload:
      schema: appname.command.v1
      id: 00000022-0000-4000-8000-000000000005
      kind: layer.rename
      target:
        layerId: aaaaaaaa-0000-4000-8000-000000000002
      params:
        name: Sky
    expectError: error.command.locked
notes:
- errors = the §40.1 baseline set (first 11 entries, reachable from every kind, stages 0-6) followed by this
  kind's entry-specific MessageIds from Part 40; wildcards (error.api.*, error.permission.*, error.engine.*)
  are Appendix H family references.
- 'tests.quartet = the four §40.1 generated suites instantiated for every kind from the registry: prop_cmd_roundtrip[kind]
  (§34.4 property 7), prop_cmd_undo[kind] (§34.4 property 9/§10.4), replay_cmd_journal[kind] (§7.8/§10.6/§7.6),
  action_cmd_roundtrip[kind] (§26.1); per-kind lists below are the extras only.'
- 'Non-finite policy (§0.3/§40.1), inlined: numeric params arriving non-finite are never a validation error
  - NaN clamps to the field''s documented default, +/-Inf to the field''s documented min/max, every clamp
  recorded in the command-validation detail; error.schema.non_finite is reachable only on the write side (journal/action
  serialization), so it is not listed under errors.'
- 'undo: param inverse (SetProp name, previous value from the recorder) (§40.3).'
- JSON Schema minLength/maxLength count code points, which matches the Unicode-scalar-value rule for well-formed
  JSON strings.
