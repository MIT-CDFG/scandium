linkingKind: static
linking: >-
  static-vendored, per the spec-side record and ES §48.1 row: mlua +
  mlua-sys as normal cargo dependencies of appname-script; the Lua 5.4.8
  C tree cc-compiled at build time from the lua-src package sources
  (pinned + checksummed through Cargo.lock like every crate — §36.2
  supply-chain posture holds with zero extra machinery, unlike the
  LibRaw/ONNX dylib channels). No build-time network fetch anywhere in
  the chain (lua-src bundles its trees inside the .crate — sealed-read
  verified). MIT imposes no linking constraint; static into the
  GPL-3.0-only appname-script is clean. Never a dependency of
  appname-cabi / appname-py.
