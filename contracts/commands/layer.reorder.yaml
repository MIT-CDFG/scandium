# appname spec artifact — generated-from: ENGINEERING-SPEC.md Part 40 §40.3 + §10.3 layer.*/mask.* family tables
# spec-version: 5.6   artifact-schema: appname.command-package.v1   authority: artifact
# rule: a PR changing normative behavior updates the document section, this artifact,
#       its tests, and generated docs IN THE SAME PR (Appendix I).
kind: layer.reorder
family: layer
schemaVersion: appname.command.LayerReorder.v1
title: Move a node to a new parent/index
specRef:
- §10.3
- §40.3
class: R
inverse: param
inverseNote: param (MoveNode reversed) per §10.3
mergeKey: null
targetResolution: target.layerId - the node acted on (§10.3 layer.* family rule); must resolve at stage 4
  (error.command.bad_target); lock resolution at stage 4 with transitive group locks, strictest wins (§11.1);
  moving a node into its own subtree -> error.command.bad_target (detail "destination inside moved subtree")
lockBehavior:
  pixels: irrelevant
  transparency: irrelevant
  position: irrelevant
  all: blocks
  note: ALL blocks (either endpoint's ancestry); POSITION does not - stacking is not canvas position (§11.1
    enumeration; §40.3)
selectionBehavior: ignored
paramsSchema:
  $schema: https://json-schema.org/draft/2020-12/schema
  $id: https://appname.org/spec/command/LayerReorder.v1.json
  title: appname.command.LayerReorder.v1
  type: object
  required:
  - parent
  - index
  properties:
    parent:
      type: string
      format: uuid
      description: MUST resolve to Group/root -> error.command.target_kind_mismatch
    index:
      type: integer
      minimum: 0
      description: counts bottom-to-top (§10.1); clamps to 0..=len (§40.3)
  additionalProperties: false
defaults: {}
dirtyRect: D = node bounds at old-union-new stacking position (composite order changed) · T topic:"tree"
events:
  history: always
  dirty: D
  tree: tree
historyLabel: history.layer.reorder
actionRecording: recordable; no dialog; replay resolves node and parent by name/index (§26.1 rule 3)
scripting: appname.apply({kind:'layer.reorder', target:{layerId:L}, params:{parent:G, index:0}})
errors:
- error.api.*
- error.schema.missing_field
- error.command.unknown_kind
- error.schema.out_of_range
- error.schema.duplicate_id
- error.command.bad_target
- error.command.locked
- error.command.busy
- error.permission.*
- error.engine.panic
- error.engine.*
- error.command.target_kind_mismatch
tests:
  quartet: full
  unit:
  - unit_cmd_layer_reorder_cycle_reject
  - unit_cmd_layer_reorder_alias_mapping
  workflow: []
examples:
  validMinimal:
    schema: appname.command.v1
    id: 00000019-0000-4000-8000-000000000001
    kind: layer.reorder
    target:
      layerId: aaaaaaaa-0000-4000-8000-000000000001
    params:
      parent: ffffffff-0000-4000-8000-000000000001
      index: 0
  validMaximal:
    schema: appname.command.v1
    id: 00000019-0000-4000-8000-000000000002
    kind: layer.reorder
    target:
      layerId: aaaaaaaa-0000-4000-8000-000000000001
      maskId: null
      channelId: null
    params:
      parent: ffffffff-0000-4000-8000-000000000001
      index: 5
  invalid:
  - case: missing-required (no parent)
    payload:
      schema: appname.command.v1
      id: 00000019-0000-4000-8000-000000000003
      kind: layer.reorder
      target:
        layerId: aaaaaaaa-0000-4000-8000-000000000001
      params:
        index: 0
    expectError: error.schema.missing_field
  - case: target-kind-mismatch (parent resolves to a raster layer, not Group/root)
    payload:
      schema: appname.command.v1
      id: 00000019-0000-4000-8000-000000000004
      kind: layer.reorder
      target:
        layerId: aaaaaaaa-0000-4000-8000-000000000001
      params:
        parent: aaaaaaaa-0000-4000-8000-000000000002
        index: 0
    expectError: error.command.target_kind_mismatch
  - case: cycle (destination inside the moved subtree)
    payload:
      schema: appname.command.v1
      id: 00000019-0000-4000-8000-000000000005
      kind: layer.reorder
      target:
        layerId: ffffffff-0000-4000-8000-000000000001
      params:
        parent: aaaaaaaa-0000-4000-8000-000000000003
        index: 0
    expectError: error.command.bad_target
notes:
- errors = the §40.1 baseline set (first 11 entries, reachable from every kind, stages 0-6) followed by this
  kind's entry-specific MessageIds from Part 40; wildcards (error.api.*, error.permission.*, error.engine.*)
  are Appendix H family references.
- 'tests.quartet = the four §40.1 generated suites instantiated for every kind from the registry: prop_cmd_roundtrip[kind]
  (§34.4 property 7), prop_cmd_undo[kind] (§34.4 property 9/§10.4), replay_cmd_journal[kind] (§7.8/§10.6/§7.6),
  action_cmd_roundtrip[kind] (§26.1); per-kind lists below are the extras only.'
- 'Non-finite policy (§0.3/§40.1), inlined: numeric params arriving non-finite are never a validation error
  - NaN clamps to the field''s documented default, +/-Inf to the field''s documented min/max, every clamp
  recorded in the command-validation detail; error.schema.non_finite is reachable only on the write side (journal/action
  serialization), so it is not listed under errors.'
- 'undo: param inverse MoveNode{from:to, to:from} (§10.1); zero tiles; Appendix D aliases layer.bring_forward/send_backward
  emit this kind (§10.3, §40.3).'
