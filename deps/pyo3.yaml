notes: >-
  SECURITY BASIS (advisories read first-hand from the local cargo advisory
  DB, 2026-08-13): proto's pyo3 0.26 line is rejected — RUSTSEC-2026-0176
  (out-of-bounds read in BoundListIterator/BoundTupleIterator nth/nth_back,
  affected >=0.24.0 <0.29.0) and RUSTSEC-2026-0177 (missing Sync bound on
  PyCFunction::new_closure closures, affected >=0.15.0 <0.29.0); both
  "patched >= 0.29.0" per the advisory metadata — 0.29.2 clears both, and
  the lane's recorded deny run is green at 0.29.2.
  DRAFT CORRECTION (first-hand lockfile check vs the O-SCRIPT draft): the
  draft's newTransitives named indoc 2.0.7 / unindent 0.2.4 / memoffset
  0.9.1 — NONE of the three is present in the resolved lane/script lockfile
  (pyo3 0.29.2 does not pull them here). The verified lockfile delta vs
  main is exactly: the five pyo3-* crates + target-lexicon 0.13.5
  (Apache-2.0 WITH LLVM-exception, read mechanically; build-time only as
  above). once_cell/libc/portable-atomic were already on main.
  DENY RATIFICATION (O-BUILD as deny-config owner, 2026-08-13): the
  lane/script scoped [[licenses.exceptions]] for target-lexicon is
  ENDORSED — the LLVM exception only GRANTS additional permissions
  (relaxing Apache-2.0 §4 source/notice-carriage mechanics for compiled
  redistribution) and imposes no new obligation, so the expression is
  no-worse than the allowlisted Apache-2.0; the crate is additionally
  build-time only. Scoped-to-one-crate is the right shape — do NOT
  generalize the allowlist. The exception text rides lane/script's branch
  (not duplicated here, per the O-INT merge instruction).
  maturin is BUILD-time wheel tooling (cbindgen-class, absent from the
  lockfile, nothing vendored, never linked) — covered by this filing, no
  separate record needed unless it becomes a distributed artifact.
