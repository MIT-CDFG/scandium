# appname spec artifact — generated-from: ENGINEERING-SPEC.md Part 40 §40.4 + §10.3 selection.*/channel.* family tables
# spec-version: 5.6   artifact-schema: appname.command-package.v1   authority: artifact
# rule: a PR changing normative behavior updates the document section, this artifact,
#       its tests, and generated docs IN THE SAME PR (Appendix I).
kind: channel.edit
family: channel
schemaVersion: appname.command.ChannelEdit.v1
title: Non-interactive channel surface/prop edit (painting emits brush.stroke targeting channelId)
specRef:
- §10.3
- §40.4
class: R
inverse: delta
mergeKey: null
targetResolution: target.channelId (§10.3 channel.* family rule); a surface edit on a component channel writes
  through into the active raster layer's corresponding component (§14.1)
lockBehavior:
  pixels: blocks
  transparency: irrelevant
  position: irrelevant
  all: blocks
  note: 'alpha channels: none; component write-through: PIXELS/ALL on the active layer block, TRANSPARENCY
    is unaffected (components never touch alpha) (§40.4)'
selectionBehavior: gates coverage (surface edits apply through sel(p), §13.1)
paramsSchema:
  $schema: https://json-schema.org/draft/2020-12/schema
  $id: https://appname.org/spec/command/ChannelEdit.v1.json
  title: appname.command.ChannelEdit.v1
  type: object
  properties:
    edit:
      type: object
      required:
      - op
      additionalProperties: false
      properties:
        op:
          enum:
          - fill
          - invert
          - levels
          - gaussian_blur
          description: non-interactive channel surface edit op (§10.3); interactive painting emits brush.stroke
            instead
        value:
          type: number
          minimum: 0
          maximum: 1
          description: 'fill coverage value, op:''fill'' only (Part 40: fill -> value 0..=1)'
        params:
          type: object
          additionalProperties: false
          description: 'op payload - levels: §17.2 param shape; gaussian_blur: sigma'
          properties:
            inBlack:
              type: number
              minimum: 0
              maximum: 1
              default: 0
              description: 'levels (§17.2); cross-field: inWhite - inBlack >= 1/255'
            inWhite:
              type: number
              minimum: 0
              maximum: 1
              default: 1
              description: levels (§17.2)
            gamma:
              type: number
              minimum: 0.1
              maximum: 10
              default: 1
              description: levels (§17.2)
            outBlack:
              type: number
              minimum: 0
              maximum: 1
              default: 0
              description: levels (§17.2)
            outWhite:
              type: number
              minimum: 0
              maximum: 1
              default: 1
              description: levels (§17.2)
            sigma:
              type: number
              minimum: 0
              maximum: 1000
              description: 'gaussian_blur sigma, px (Part 40: blur -> sigma 0..=1000 px)'
      allOf:
      - if:
          properties:
            op:
              const: fill
          required:
          - op
        then:
          required:
          - value
      - if:
          properties:
            op:
              const: invert
          required:
          - op
        then:
          properties:
            value: false
            params: false
    name:
      type: string
      description: renaming a component channel -> error.command.target_kind_mismatch (components have no
        independent identity, §14.1)
    ink:
      type: object
      required:
      - model
      - comps
      - profile
      additionalProperties: false
      properties:
        model:
          enum:
          - gray
          - gray_a
          - rgb
          - rgba
          - cmyk
          - cmyk_a
          - lab
          - lab_a
          description: ColorModelKind (§2.2), snake_case wire form per §2.8
        comps:
          type: array
          items:
            type: number
          minItems: 4
          maxItems: 4
          description: '[f32; 4] components (§22.1)'
        profile:
          type: string
          format: uuid
          description: ProfileId (§5)
      description: reserved Post-1.0 spot param -> error.unsupported.spot_channels in v1 (§40.4)
    solidity:
      type: number
      minimum: 0
      maximum: 1
      description: reserved Post-1.0 spot param -> error.unsupported.spot_channels in v1 (§40.4)
  additionalProperties: false
defaults: {}
dirtyRect: 'alpha target: no composite D · T topic:"channels"; component write-through: D = written region
  on the active layer (composite changes) + T topic:"channels"'
events:
  history: always
  dirty: D
  tree: channels
  note: D only for component write-through (alpha targets emit no composite D, §40.4)
historyLabel: history.channel.edit
actionRecording: recordable; dialog-driven ops (levels/blur) capture committed params
scripting: appname.apply({kind:'channel.edit', target:{channelId:C}, params:{edit:{op:'invert'}}})
errors:
- error.api.*
- error.schema.missing_field
- error.command.unknown_kind
- error.schema.out_of_range
- error.schema.duplicate_id
- error.command.bad_target
- error.command.locked
- error.command.busy
- error.permission.*
- error.engine.panic
- error.engine.*
- error.command.target_kind_mismatch
- error.unsupported.spot_channels
tests:
  quartet: full
  unit:
  - unit_cmd_channel_edit_component_write_through (locked layer blocks it)
  workflow: []
examples:
  validMinimal:
    schema: appname.command.v1
    id: 00000046-0000-4000-8000-000000000001
    kind: channel.edit
    target:
      channelId: cccccccc-0000-4000-8000-000000000001
    params:
      edit:
        op: invert
  validMaximal:
    schema: appname.command.v1
    id: 00000046-0000-4000-8000-000000000002
    kind: channel.edit
    target:
      layerId: null
      maskId: null
      channelId: cccccccc-0000-4000-8000-000000000001
    params:
      edit:
        op: fill
        value: 1
      name: sky matte
  invalid:
  - case: component-rename (name on a component channel, §14.1)
    payload:
      schema: appname.command.v1
      id: 00000046-0000-4000-8000-000000000003
      kind: channel.edit
      target:
        channelId: cccccccc-0000-4000-8000-00000000000c
      params:
        name: red2
    expectError: error.command.target_kind_mismatch
  - case: spot-params-in-v1 (solidity present)
    payload:
      schema: appname.command.v1
      id: 00000046-0000-4000-8000-000000000004
      kind: channel.edit
      target:
        channelId: cccccccc-0000-4000-8000-000000000001
      params:
        solidity: 0.5
    expectError: error.unsupported.spot_channels
  - case: bad-enum (edit.op 'sharpen')
    payload:
      schema: appname.command.v1
      id: 00000046-0000-4000-8000-000000000005
      kind: channel.edit
      target:
        channelId: cccccccc-0000-4000-8000-000000000001
      params:
        edit:
          op: sharpen
    expectError: error.schema.out_of_range
  - case: locked (component write-through onto a PIXELS-locked active layer)
    payload:
      schema: appname.command.v1
      id: 00000046-0000-4000-8000-000000000006
      kind: channel.edit
      target:
        channelId: cccccccc-0000-4000-8000-00000000000c
      params:
        edit:
          op: invert
    expectError: error.command.locked
notes:
- errors = the §40.1 baseline set (first 11 entries, reachable from every kind, stages 0-6) followed by this
  kind's entry-specific MessageIds from Part 40; wildcards (error.api.*, error.permission.*, error.engine.*)
  are Appendix H family references.
- 'tests.quartet = the four §40.1 generated suites instantiated for every kind from the registry: prop_cmd_roundtrip[kind]
  (§34.4 property 7), prop_cmd_undo[kind] (§34.4 property 9/§10.4), replay_cmd_journal[kind] (§7.8/§10.6/§7.6),
  action_cmd_roundtrip[kind] (§26.1); per-kind lists below are the extras only.'
- 'Non-finite policy (§0.3/§40.1), inlined: numeric params arriving non-finite are never a validation error
  - NaN clamps to the field''s documented default, +/-Inf to the field''s documented min/max, every clamp
  recorded in the command-validation detail; error.schema.non_finite is reachable only on the write side (journal/action
  serialization), so it is not listed under errors.'
- '§40.4 family rule, inlined: channel kinds emit T topic:"channels"; component channels are structurally
  read-only (§14.1) - kinds that would delete, duplicate in place, or reorder them fail with error.command.target_kind_mismatch.'
- 'validates (§40.4): edit.op payload as mask.edit (fill -> value 0..=1, levels -> §17.2 shape, blur -> sigma
  0..=1000 px).'
- 'undo: channel-surface tile deltas (or layer tile deltas for component write-through).'
