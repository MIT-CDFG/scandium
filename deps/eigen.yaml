  release of the 3.4 line, verified first-hand 2026-08-17 via the GitLab
  releases API (released_at 2025-09-29; tags API commit date agrees).
  NOT hand-remembered: the widely-cited "latest stable 3.4.x = 3.4.0
  (2021)" is stale — 3.4.1 shipped 2025-09-29, and Eigen 5.0.0/5.0.1
