# SPDX-License-Identifier: Apache-2.0
# Copyright (c) 2026 the Appname contributors
#
# cbindgen configuration for the generated C header (include/appname.h).
# Regenerate with crates/appname-cabi/gen_header.sh; drift against the
# committed header is a test failure (ES Appendix N.2 `abi_sym_header_drift`
# discipline, seeded in crates/appname-cabi/tests/c_smoke.rs).

language = "C"
include_guard = "APPNAME_H"
include_version = true
documentation = true
documentation_style = "c99"
cpp_compat = true
usize_is_size_t = true
header = """/* SPDX-License-Identifier: Apache-2.0
 * Copyright (c) 2026 the Appname contributors
 *
 * appname.h — the stable C ABI for the Appname engine, v1 (ABI 1.8).
 * GENERATED by cbindgen from crates/appname-cabi — do not edit by hand;
 * regenerate with crates/appname-cabi/gen_header.sh.
 *
 * Contract (ES Part 9): opaque handles; every fallible function returns an
 * AppnameStatus; rich detail rides in AppnameError out-params as UTF-8 JSON;
 * *err is untouched on APPNAME_OK and err may be NULL; every appname_*_free
 * accepts NULL as a no-op; every pointer is validated — misuse (double
 * close/free, use-after-close, wrong handle class) is a typed error, never
 * undefined behavior. The single mutation entry is
 * appname_doc_apply_command() with a raw-bytes appname.command.v1 envelope.
 * v1 is synchronous: calls are thread-safe (internally serialized per
 * document) and blocking; jobs/callbacks arrive in a later additive block.
 * Additions land only as new symbols in additive blocks with conformance
 * tests (ES §9.1, Appendix N).
 */"""
after_includes = """
/* ---- Opaque handles (ES §9.1 rule 1: layout never exposed) ------------- */
typedef struct AppnameDoc AppnameDoc;
typedef struct AppnameString AppnameString;
typedef struct AppnameError AppnameError;
typedef struct AppnameImageBuffer AppnameImageBuffer;
typedef struct AppnamePluginHost AppnamePluginHost;
"""

[export]
exclude = ["AppnameDoc", "AppnameString", "AppnameError", "AppnameImageBuffer", "AppnamePluginHost"]

[enum]
rename_variants = "ScreamingSnakeCase"

[fn]
sort_by = "None"
