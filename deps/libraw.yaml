linkingKind: dynamic-system
linking: >-
  dynamic-system, optional module — THE RECORD'S CORE POSTURE (LGPL
  module boundary, module-not-core per the plan §2.5 row): never a static
  link, never vendored-source compiled into the GPL-3.0-only binary.
  LGPL-2.1 §6 compliance = shipped only as a REPLACEABLE shared library
  ("redistribution: shipped only as replaceable shared libraries",
  spec-side record; §48.2 rule 1 linking audit; consonant with ES §1.4
  rule 2: LGPL libraries prefer a system/dynamic link). RAW never enters
  the core link graph: consumer is appname-io ONLY, behind feature `raw`,
  surfaced through the codec registry like every codec; ES §1.4 core-
  isolation rule 5 + the deny.toml wrappers stanza (name "libraw-sys",
  wrappers ["appname-io"], ES:934) + scripts/check-arch.sh (libraw_sys
  row, ES:972) enforce the boundary mechanically once the facade lands.
