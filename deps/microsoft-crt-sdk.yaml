obligations: >-
  ★★★ THREE FINDINGS FROM THE FIRST-HAND READ, EACH QUOTED VERBATIM, EACH AGAINST
  ACCEPTANCE FOR THIS USE:
  (1) THE GRANT IS CONDITIONED ON A PRODUCT WE DO NOT HAVE. "You may install and
  use any number of copies of the software to use SOLELY WITH Visual Studio
  Community, Visual Studio Professional, and Visual Studio Enterprise, to develop
  and test your applications." This host has no Visual Studio; cargo-xwin exists
  precisely to use these files WITHOUT it.
  (2) THE BUILD-DEVICE CLAUSE IS SCOPED THE SAME WAY. Build Devices may use the
  files "solely to compile, build, and verify applications DEVELOPED BY USING THE
  SOFTWARE". Appname is developed with cargo/rustc, not with Visual Studio.
  (3) THE MATERIAL WE ACTUALLY NEED MAY NOT BE GOVERNED BY THIS DOCUMENT AT ALL.
  "Microsoft Platforms. The software may include components from Microsoft
  Windows ... These components are GOVERNED BY SEPARATE AGREEMENTS and their own
  product support policies." The Windows SDK headers and CRT import libraries are
  exactly such components. Accepting this EULA would therefore not even be
  accepting the terms that govern the fetched material.
  ★ AND ON THE RECORD'S LOAD-BEARING QUESTION — REDISTRIBUTION — THE ANSWER IS AN
  ABSENCE, MEASURED WITH A LIVE CONTROL: the strings "distributable"/"redistribut"
  occur ZERO times in the full text (grep rc=1; CONTROL "build devices" returns 1,
