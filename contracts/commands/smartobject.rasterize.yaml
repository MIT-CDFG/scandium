kind: smartobject.rasterize
family: smartobject
schemaVersion: appname.command.SmartobjectRasterize.v1
title: Bake the cached composite to a Raster layer, dropping source + smart filters
specRef: ["§10.3", "§40.7", "§11.5", "§10.4"]
