  - 'credits/About-screen attribution: lensfun database acknowledgment (CC-BY-SA-3.0, contributors line) in the shell About dialog third-party credits — queued with the O-UI About mints alongside the lucide asset surface (obligation surface a, credits half)'
  - 'share-alike contributed-back workflow note: rides this notices entry verbatim via the shareAlikeWorkflow field (obligation surface b)'
  - 'basis line in the addendum: rides this notices entry verbatim via the basis field (obligation surface c)'
  - 'user-replaceable data dir posture: documented in data/lensfun-db/README.md and the stagedDirContract field; enforced by the reader (untrusted input, typed errors, never panics) and the O-INT consumer-seam ruling (obligation surface d)'
