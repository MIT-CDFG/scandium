# appname spec artifact — generated-from: ENGINEERING-SPEC.md Part 40 §40.2 + §10.3 doc.* family table
# spec-version: 5.6   artifact-schema: appname.command-package.v1   authority: artifact
# rule: a PR changing normative behavior updates the document section, this artifact,
#       its tests, and generated docs IN THE SAME PR (Appendix I).
kind: doc.mode_convert
family: doc
schemaVersion: appname.command.DocModeConvert.v1
title: Convert color mode (§6.2); incompatible adjustment layers are rasterized or dropped with a per-layer
  warning report
specRef:
- §10.3
- §40.2
class: C
inverse: snap
mergeKey: null
targetResolution: applied through the document handle; the target block is ignored (§10.3 doc.* family rule)
  - no target field resolves
lockBehavior:
  pixels: irrelevant
  transparency: irrelevant
  position: irrelevant
  all: irrelevant
  note: none - document scope; locked layers convert too (a mode is document-global; §40.2)
selectionBehavior: ignored (whole-document reinterpretation; mask values unchanged)
paramsSchema:
  $schema: https://json-schema.org/draft/2020-12/schema
  $id: https://appname.org/spec/command/DocModeConvert.v1.json
  title: appname.command.DocModeConvert.v1
  type: object
  required:
  - to
  properties:
    to:
      enum:
      - rgba
      - gray_a
      - cmyk_a
      - lab_a
    profile:
      type: string
      format: uuid
      description: when given, MUST be of the destination space -> error.color.profile_space_mismatch (§40.2)
    intent:
      enum:
      - perceptual
      - relative
      - saturation
      - absolute
      default: relative
    flatten:
      type: boolean
      default: false
  additionalProperties: false
defaults:
  intent: relative
  flatten: false
dirtyRect: D [0,0,w,h] · T topic:"color" (+ topic:"tree" when layers were rasterized/dropped)
events:
  history: always
  dirty: D
  tree: color
  note: additionally topic:"tree" when layers were rasterized/dropped (§40.2)
historyLabel: history.doc.mode_convert
actionRecording: recordable; Mode menu confirm dialog captures committed params (flatten choice included)
scripting: appname.apply({kind:'doc.mode_convert', params:{to:'cmyk_a', intent:'relative'}})
errors:
- error.api.*
- error.schema.missing_field
- error.command.unknown_kind
- error.schema.out_of_range
- error.schema.duplicate_id
- error.command.bad_target
- error.command.locked
- error.command.busy
- error.permission.*
- error.engine.panic
- error.engine.*
- error.color.profile_space_mismatch
- error.color.profile_class
tests:
  quartet: full
  unit:
  - unit_cmd_doc_mode_convert_adjustment_report
  golden:
  - cmyk_lab_modes.appname (§34.1)
  workflow: []
examples:
  validMinimal:
    schema: appname.command.v1
    id: 00000008-0000-4000-8000-000000000001
    kind: doc.mode_convert
    params:
      to: gray_a
  validMaximal:
    schema: appname.command.v1
    id: 00000008-0000-4000-8000-000000000002
    kind: doc.mode_convert
    target:
      layerId: null
      maskId: null
      channelId: null
    params:
      to: cmyk_a
      profile: eeeeeeee-0000-4000-8000-000000000002
      intent: absolute
      flatten: true
  invalid:
  - case: missing-required (no to)
    payload:
      schema: appname.command.v1
      id: 00000008-0000-4000-8000-000000000003
      kind: doc.mode_convert
      params:
        intent: relative
    expectError: error.schema.missing_field
  - case: bad-enum (to 'rgb' is not a documented mode literal)
    payload:
      schema: appname.command.v1
      id: 00000008-0000-4000-8000-000000000004
      kind: doc.mode_convert
      params:
        to: rgb
    expectError: error.schema.out_of_range
  - case: profile-not-destination-space (RGB profile given for to:'cmyk_a'; live-state)
    payload:
      schema: appname.command.v1
      id: 00000008-0000-4000-8000-000000000005
      kind: doc.mode_convert
      params:
        to: cmyk_a
        profile: eeeeeeee-0000-4000-8000-000000000001
    expectError: error.color.profile_space_mismatch
notes:
- errors = the §40.1 baseline set (first 11 entries, reachable from every kind, stages 0-6) followed by this
  kind's entry-specific MessageIds from Part 40; wildcards (error.api.*, error.permission.*, error.engine.*)
  are Appendix H family references.
- 'tests.quartet = the four §40.1 generated suites instantiated for every kind from the registry: prop_cmd_roundtrip[kind]
  (§34.4 property 7), prop_cmd_undo[kind] (§34.4 property 9/§10.4), replay_cmd_journal[kind] (§7.8/§10.6/§7.6),
  action_cmd_roundtrip[kind] (§26.1); per-kind lists below are the extras only.'
- 'Non-finite policy (§0.3/§40.1), inlined: numeric params arriving non-finite are never a validation error
  - NaN clamps to the field''s documented default, +/-Inf to the field''s documented min/max, every clamp
  recorded in the command-validation detail; error.schema.non_finite is reachable only on the write side (journal/action
  serialization), so it is not listed under errors.'
- conversion math per §6.2/§5.3; adjustment layers incompatible with the target mode are rasterized or dropped;
  the per-layer report travels in the command result detail and the history event, mirroring CompatReport
  action vocabulary (§8.5).
- 'undo: snapshot (§10.4) - pre-command snapshot restored as a new CheckpointOnly entry.'
