notes: >-
  FIRST appname.data-package.v1 record. Divergence from the O-ALGO
  draft, recorded: the draft's landingPaths listed the reader AND the
  data dir as activation surfaces; this record's activation triggers
  (dataPaths) are the DATA only — the reader is own code carrying none
  of the data license's expression, and its presence alone must never
  activate attribution for data that is not in the tree (the pymatting
  deliberately-not-listed argument, inverted); the reader rides the
  informational consumers field instead. Draft's other claims verified
  first-hand 2026-08-17: pin, license id, license text sha (vendored ==
  upstream raw bytes at pin), payload inventory 56+3 (the count-error
  hunt found no NEW errors beyond the already-recorded PROVENANCE
  off-by-one), basis line, obligations verbatim vs INTEGRATION-NOTES §1
  row 7. One copyright-field refinement vs the draft: the profile files
  carry NO formal copyright notices (draft implied per-profile
  contributor credits generally; the files carry sparse "Thanks to …" /
  "Calibrated … by …" comments — preserved byte-identical). The
  LGPL-3.0 lensfun LIBRARY is not linked, not vendored, not consulted
  (review-verified own Rust from DTD/XSD + observable data; census
  README read: libs/ LGPL-3.0, apps GPL-3.0, tests/tools public
  domain). Pin drift rule: refreshing the database later requires a
  fresh upstream pin, a fresh first-hand license read, and a new
  payloadSha256 — recorded census-style in this record's history.
