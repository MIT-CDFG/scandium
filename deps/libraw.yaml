# links DYNAMICALLY as an optional module + the OWN in-workspace `libraw-sys`
# facade crate (TO BE CREATED at consumption — see the binding-census
# finding). APPROVED-UNCONSUMED: this record precedes the dependency
# (deps/README.md rule: record FIRST). No LibRaw code, binding, or dylib is
# in this tree today — appname-io's `raw` feature compiles the develop-stage
# math and a typed-NI refusal at `RawCodec::decode` only. Like deps/ort.yaml
# this record deliberately renders in NO section of THIRD-PARTY-NOTICES.md
# yet (gen_notices classifies on the shipped cargo graph / vendoredTexts /
# recordKind / the "dynamic system library" linking form — all inapplicable
# pre-landing; the hyphenated "dynamic-system, optional module" wording
# below is the spec-side record's own form and is deliberate: the notice
# fires when the dylib first ships, per obligations). Ratified from the
# O-IO RAW-wave draft (reports/O-IO-log.md §2 on lane/io) with every
# record-level claim re-verified first-hand by O-BUILD 2026-08-17 (sealed
# shallow clone at the pinned tag + raw-bytes license reads + crates.io
# registry API census + a sealed .crate read — sources inline below).
# Due-diligence record, not a release claim.
name: LibRaw (C library) + own in-workspace libraw-sys facade crate
