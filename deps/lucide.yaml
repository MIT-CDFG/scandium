notes: >-
  Election rationale (O-UI, ratified here): uniform 24px/2px stroke grid
  suits the dark professional shell at 16-20px render sizes; plain stroke
  primitives sit inside QtSvg's supported subset; upstream excludes brand
  logos by policy (zero trademark surface in the pool). Runner-up
  phosphor-icons/core (MIT, "Copyright (c) 2023 Phosphor Icons", O-BUILD
  raw-byte re-read at pin 2b75f3ad12b420c9504ef05df8d2564a28f8500e
  2026-08-13, LICENSE sha256
  b5b1f1da112d18ea2147decfd48ddc1bf2b5aeb6c265381579340e95b15a2bb2)
  remains the documented fallback; its pool includes *-logo brand glyphs
  with no written trademark caveat, which a selection would have to
  exclude. currentColor election (the decision the draft deferred to
  O-BUILD): vendor the SVG bytes VERBATIM from upstream at pin (keeps the
  vendored files diffable against upstream and the provenance clean) and
  recolor at render time in the shell (IconImage/layer effect) — do NOT
  rewrite currentColor inside the vendored files; if O-UI's QtSvg
  constraints force a rewrite after all, the modified copies must be
  marked modified-from-upstream in the vendoring commit and this record
  amended. Pin drift: additional icons later require a fresh pin + fresh
  first-hand LICENSE read logged census-style; re-read at checkpoint
  boundaries alongside the O-INT sweep. Landing layout expected by this
  record: SVGs + LICENSE under shell/icons/lucide/ (the landingPaths
  trigger); if O-UI lands elsewhere, amend landingPaths and
  licenseTextRepoPath in the SAME commit (gate notices step enforces).
