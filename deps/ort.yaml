obligations: 'CRATE NOTICE: activates mechanically in THIRD-PARTY-NOTICES
  when ort/ort-sys enter the shipped cargo graph (elected-arm Apache-2.0
  text + pyke.io copyright). C LIBRARY NOTICE + PACKAGING CHANNEL: the MIT
  notice for ONNX Runtime (Microsoft copyright, sha256-pinned above) MUST be
  carried when libonnxruntime first ships in an artifact — and the dylib
  itself needs its OWN provenance row at packaging. PACKAGING-CHANNEL GAP,
  recorded: ES Part 48 does not specify where the libonnxruntime binary
  comes from (the ES mentions ONNX Runtime in exactly four places — crate
  map ES:847, SPK-8 ES:11226, the pin-table row ES:16944, §53.9 ES:18230 —
  none names a dylib provenance channel; §53.9''s download/CDN machinery
  covers MODEL PACKS, not the runtime library; the spec-side record says
  only "redistribution: allowed"). The dmg/packaging wave therefore decides
  build-from-source vs pinned official release binary and records source +
  hash for the shipped dylib in this record before any artifact ships.
  Offline posture stands regardless: the library arrives via that recorded
  packaging channel, never via a build-time fetch.'
