kind: image.flatten
family: image
schemaVersion: appname.command.ImageFlatten.v1
title: Flatten the whole document to one background raster (§12.4; historical id, document scope)
specRef:
- §10.3
- §40.2
class: C
inverse: snap
mergeKey: null
targetResolution: applied through the document handle; the target block is ignored (§10.3 doc.* family rule)
  - no target field resolves
lockBehavior:
  pixels: irrelevant
  transparency: irrelevant
  position: irrelevant
  all: irrelevant
  note: none checked - flatten is document-scope restructuring; per-node locks die with the nodes (§40.2)
selectionBehavior: ignored (selection survives flatten unchanged)
paramsSchema:
  $schema: https://json-schema.org/draft/2020-12/schema
  $id: https://appname.org/spec/command/ImageFlatten.v1.json
  title: appname.command.ImageFlatten.v1
  type: object
  properties:
    discardHidden:
      type: boolean
      default: true
      description: false keeps hidden layers' pixels by compositing only visible ones into the background
        while deleting all nodes (§12.4 semantics)
  additionalProperties: false
defaults:
  discardHidden: true
dirtyRect: D [0,0,w,h] · T topic:"tree"
events:
  history: always
  dirty: D
  tree: tree
historyLabel: history.image.flatten
actionRecording: recordable; no dialog; re-run on a flat document is a no-op push (§40.1)
scripting: appname.apply({kind:'image.flatten', params:{discardHidden:true}})
errors:
- error.api.*
- error.schema.missing_field
- error.command.unknown_kind
- error.schema.out_of_range
- error.schema.duplicate_id
- error.command.bad_target
- error.command.locked
- error.command.busy
- error.permission.*
- error.engine.panic
- error.engine.*
tests:
  quartet: full
  unit:
  - unit_cmd_image_flatten_matches_composite (flattened pixels == render of the unflattened doc, §4.6 determinism)
  workflow: []
examples:
  validMinimal:
    schema: appname.command.v1
    id: 00000012-0000-4000-8000-000000000001
    kind: image.flatten
    params: {}
  validMaximal:
    schema: appname.command.v1
    id: 00000012-0000-4000-8000-000000000002
    kind: image.flatten
    target:
      layerId: null
      maskId: null
      channelId: null
    params:
      discardHidden: false
  invalid:
  - case: mistyped (discardHidden as string)
    payload:
      schema: appname.command.v1
      id: 00000012-0000-4000-8000-000000000003
      kind: image.flatten
      params:
        discardHidden: 'yes'
    expectError: error.schema.missing_field
  - case: 'unknown-kind (stage 2: ''image.flatten_all'' is not registered)'
    payload:
      schema: appname.command.v1
      id: 00000012-0000-4000-8000-000000000004
      kind: image.flatten_all
      params: {}
    expectError: error.command.unknown_kind
  - case: busy (schema-valid payload while an exclusive job depends on the document, §9.5)
    payload:
      schema: appname.command.v1
      id: 00000012-0000-4000-8000-000000000005
      kind: image.flatten
      params: {}
    expectError: error.command.busy
