notes: >-
  FALLBACK: mingw-w64 (GCC, GPL with runtime exception) reaches
  x86_64-pc-windows-gnu with no proprietary fetch and no acceptance step. It is
  a DIFFERENT TARGET TRIPLE, not a drop-in — the ABI, the CRT, and the produced
  .dll differ from MSVC, so a mingw build does not evidence an MSVC build. Also
  absent from this host.
  ★ WHY THIS MATTERS NOW RATHER THAN LATER: measured 2026-08-24, a
  `cargo check --target x86_64-pc-windows-msvc --workspace` reached only 1 of
  our 18 crates before five native C build scripts (zstd-sys, lz4-sys,
  libz-sys, lcms2-sys, blake3) failed for want of a cross C toolchain. THE
  PORTABILITY CENSUS CANNOT PROCEED WITHOUT ONE. This licence question is on
  the critical path, not beside it.
