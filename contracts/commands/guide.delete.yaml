kind: guide.delete
family: guide
schemaVersion: appname.command.GuideDelete.v1
title: Remove one guide
specRef: ["§10.3", "§40.8", "§24.2"]
class: R
dagger: false
inverse: param   # re-add at the recorded position
mergeKey: null
targetResolution: >-
  none — no target block; (orientation, index) addresses the sorted vectors; index within range
  is a live-state check → error.schema.out_of_range.
lockBehavior:
  transparency: irrelevant
  position: irrelevant
  pixels: irrelevant
  all: irrelevant
  note: none — not node-targeted
selectionBehavior: ignored
paramsSchema:
  $schema: https://json-schema.org/draft/2020-12/schema
  $id: https://appname.org/spec/command/GuideDelete.v1.json
  title: appname.command.GuideDelete.v1
  type: object
  required: [orientation, index]
  additionalProperties: false
  properties:
    orientation: { enum: [horizontal, vertical] }
    index: { type: integer, minimum: 0 }
defaults: null   # note: both params required
dirtyRect: "no composite D; overlay scope:\"guides\""
events:
  history: always
  dirty: "null (overlay scope:\"guides\" only)"
  tree: "topic:\"guides\""
historyLabel: history.guide.delete
actionRecording: recordable; no dialog.
scripting: "appname.apply({kind:'guide.delete', params:{orientation:'horizontal', index:2}})"
errors:
  - error.api.*
  - error.schema.missing_field
  - error.command.unknown_kind
  - error.schema.out_of_range
  - error.schema.duplicate_id
  - error.command.bad_target
  - error.command.locked
  - error.command.busy
  - error.permission.*
  - error.engine.panic
tests:
  quartet: implied (§40.1) — no extra named tests (§40.8 entry)
  unit: []
  golden: []
  workflow: [W15]
examples:
  validMinimal:
    schema: appname.command.v1
    id: "00000000-0000-4000-8000-000000001301"
    kind: guide.delete
    params: { orientation: horizontal, index: 2 }
  validMaximal:
    schema: appname.command.v1
    id: "00000000-0000-4000-8000-000000001302"
    kind: guide.delete
    params: { orientation: vertical, index: 0 }
    timestamp: "2026-01-01T00:00:00Z"   # params has no optional fields; envelope optional shown
  invalid:
    - case: missing-required-orientation
      payload:
        schema: appname.command.v1
        id: "00000000-0000-4000-8000-000000001303"
        kind: guide.delete
        params: { index: 0 }
      expectError: error.schema.missing_field
    - case: negative-index
      payload:
        schema: appname.command.v1
        id: "00000000-0000-4000-8000-000000001304"
        kind: guide.delete
        params: { orientation: vertical, index: -3 }
      expectError: error.schema.out_of_range
    - case: index-beyond-vector
      payload:
        schema: appname.command.v1
        id: "00000000-0000-4000-8000-000000001305"
        kind: guide.delete
        params: { orientation: horizontal, index: 42 }   # live-state range check (§40.8)
      expectError: error.schema.out_of_range
