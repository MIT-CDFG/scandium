# appname spec artifact — generated-from: ENGINEERING-SPEC.md Part 40 §40.4 + §10.3 selection.*/channel.* family tables
# spec-version: 5.6   artifact-schema: appname.command-package.v1   authority: artifact
# rule: a PR changing normative behavior updates the document section, this artifact,
#       its tests, and generated docs IN THE SAME PR (Appendix I).
kind: selection.load
family: selection
schemaVersion: appname.command.SelectionLoad.v1
title: Load a channel/mask/alpha as the selection (§14.2)
specRef:
- §10.3
- §40.4
class: R
inverse: delta
mergeKey: null
targetResolution: none - the selection is document state; the mask buffer is the selection_surface (§10.1);
  the target block is unused (§10.3/§40.4 family rule); the referenced surface id resolves at stage 4
lockBehavior:
  pixels: irrelevant
  transparency: irrelevant
  position: irrelevant
  all: irrelevant
  note: none - selection changes are never lock-gated (§11.1 permits selection changes under every lock; §40.4
    family rule)
selectionBehavior: writes selection - source coverage combined per op, optionally inverted first; a component
  channel loads its value as coverage per §14.1 soloing rules
paramsSchema:
  $schema: https://json-schema.org/draft/2020-12/schema
  $id: https://appname.org/spec/command/SelectionLoad.v1.json
  title: appname.command.SelectionLoad.v1
  type: object
  required:
  - source
  properties:
    source:
      type: object
      additionalProperties: false
      properties:
        channelId:
          type: string
          format: uuid
        maskId:
          type: string
          format: uuid
        layerAlpha:
          type: string
          format: uuid
          description: a layer id whose alpha is loaded
      oneOf:
      - required:
        - channelId
      - required:
        - maskId
      - required:
        - layerAlpha
      description: '§10.3 grammar: source:{channelId:uuid | maskId:uuid | layerAlpha:uuid} - exactly one (stage-3
        oneOf, §40.4)'
    op:
      enum:
      - replace
      - add
      - subtract
      - intersect
      default: replace
    invert:
      type: boolean
      default: false
  additionalProperties: false
defaults:
  op: replace
  invert: false
dirtyRect: no composite D (pixels untouched; the marching-ants overlay repaints via dirtyRects scope:"selection",
  §9.5/§13.5) · T topic:"selection" (payload carries the post-command bounds, §13.1)
events:
  history: always
  dirty: null
  tree: selection
historyLabel: history.selection.load
actionRecording: recordable; Load Selection dialog captures committed params; channel resolves by id - cross-document
  actions re-resolve by channel name, index fallback (§26.1 rule 3 analogue)
scripting: appname.apply({kind:'selection.load', params:{source:{channelId:C}, op:'replace'}})
errors:
- error.api.*
- error.schema.missing_field
- error.command.unknown_kind
- error.schema.out_of_range
- error.schema.duplicate_id
- error.command.bad_target
- error.command.locked
- error.command.busy
- error.permission.*
- error.engine.panic
- error.engine.*
tests:
  quartet: full
  unit:
  - unit_cmd_selection_load_roundtrip (save -> none -> load == original mask)
  workflow: []
examples:
  validMinimal:
    schema: appname.command.v1
    id: 00000043-0000-4000-8000-000000000001
    kind: selection.load
    params:
      source:
        channelId: cccccccc-0000-4000-8000-000000000001
  validMaximal:
    schema: appname.command.v1
    id: 00000043-0000-4000-8000-000000000002
    kind: selection.load
    params:
      source:
        layerAlpha: aaaaaaaa-0000-4000-8000-000000000001
      op: subtract
      invert: true
  invalid:
  - case: oneof-violated (source object empty - none of the three keys)
    payload:
      schema: appname.command.v1
      id: 00000043-0000-4000-8000-000000000003
      kind: selection.load
      params:
        source: {}
    expectError: error.schema.missing_field
  - case: bad-target (source channelId does not resolve, stage 4)
    payload:
      schema: appname.command.v1
      id: 00000043-0000-4000-8000-000000000004
      kind: selection.load
      params:
        source:
          channelId: 0badbad0-0000-4000-8000-00000000dead
    expectError: error.command.bad_target
  - case: bad-enum (op 'xor' not a §13.2 boolean)
    payload:
      schema: appname.command.v1
      id: 00000043-0000-4000-8000-000000000005
      kind: selection.load
      params:
        source:
          channelId: cccccccc-0000-4000-8000-000000000001
        op: xor
    expectError: error.schema.out_of_range
notes:
- errors = the §40.1 baseline set (first 11 entries, reachable from every kind, stages 0-6) followed by this
  kind's entry-specific MessageIds from Part 40; wildcards (error.api.*, error.permission.*, error.engine.*)
  are Appendix H family references.
- 'tests.quartet = the four §40.1 generated suites instantiated for every kind from the registry: prop_cmd_roundtrip[kind]
  (§34.4 property 7), prop_cmd_undo[kind] (§34.4 property 9/§10.4), replay_cmd_journal[kind] (§7.8/§10.6/§7.6),
  action_cmd_roundtrip[kind] (§26.1); per-kind lists below are the extras only.'
- 'Non-finite policy (§0.3/§40.1), inlined: numeric params arriving non-finite are never a validation error
  - NaN clamps to the field''s documented default, +/-Inf to the field''s documented min/max, every clamp
  recorded in the command-validation detail; error.schema.non_finite is reachable only on the write side (journal/action
  serialization), so it is not listed under errors.'
- '§40.4 family rule, inlined: selection kinds are never lock-gated (§11.1 permits selection changes under
  every lock) and never dirty the composite; all boolean combination uses §13.2 math; geometric sources rasterize
  with analytic AA (§13.1); undo is selection-surface tile deltas unless the row says param.'
- 'undo: selection-surface tile deltas.'
