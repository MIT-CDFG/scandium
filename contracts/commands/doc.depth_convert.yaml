kind: doc.depth_convert
family: doc
schemaVersion: appname.command.DocDepthConvert.v1
title: Convert storage depth (§6.1/§6.3); promotion is lossless, demotion dithers
specRef:
- §10.3
- §40.2
class: C
inverse: snap
mergeKey: null
targetResolution: applied through the document handle; the target block is ignored (§10.3 doc.* family rule)
  - no target field resolves
lockBehavior:
  pixels: irrelevant
  transparency: irrelevant
  position: irrelevant
  all: irrelevant
  note: none - document scope (§40.2 family rule)
selectionBehavior: ignored (mask stays f32 regardless of storage depth, §13.1)
paramsSchema:
  $schema: https://json-schema.org/draft/2020-12/schema
  $id: https://appname.org/spec/command/DocDepthConvert.v1.json
  title: appname.command.DocDepthConvert.v1
  type: object
  required:
  - to
  properties:
    to:
      enum:
      - u8
      - u16
      - f16
      - f32
    dither:
      type: boolean
      default: true
      description: down-conversions only
  additionalProperties: false
defaults:
  dither: true
dirtyRect: D [0,0,w,h] · T topic:"color"
events:
  history: always
  dirty: D
  tree: color
historyLabel: history.doc.depth_convert
actionRecording: recordable; no dialog (menu item); dither flag from the menu's committed state
scripting: appname.apply({kind:'doc.depth_convert', params:{to:'u16'}})
errors:
