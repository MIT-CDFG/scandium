  non-Bayer (X-Trans/Foveon) demosaic delegation, public per-camera color
  matrix table — ES §8.3, Part 43 (stage-ownership rule: stage 1 is LibRaw
  behind the fuzzed wrapper; stages 2–6 are Appname's own implementations,
  already landed feature-gated in appname-io). Spec-side record
  bogos/deps/libraw.yaml (§48.1 pin-table row).
