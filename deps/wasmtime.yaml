  wasmtime 47.0.4 — the minimal SECURITY fix on the 47.x line, elected
  2026-09-01 under the Q-D20 ruling. NOT the newest stable: crates.io
  offers 48.0.1, and both advisories are satisfied by 47.0.4, so the move
  is the smallest one that clears them. SUPERSEDES the 47.0.3 election
  below, which is retained as the dated record of what was verified then:
  wasmtime 47.0.3 / wasmtime-wasi 47.0.3 — the latest stable, verified
  first-hand 2026-08-18 three ways in agreement: crates.io API
  max_stable_version = newest_version = 47.0.3 for both crates (published
  2026-07-31, not yanked) and GitHub releases/latest = tag v47.0.3
  (published 2026-07-31T16:22:33Z). Tag v47.0.3 = commit
  5554cc1a651da536af2cc46c7324bdc085b162e3 (GitHub refs API).
  DIVERGENCE NOTE vs spec-side record: spec pins candidate 45.0.1
