  redistribution grant. What there IS, is a restriction: you may not "provide the
  software as a stand-alone offering or COMBINE IT WITH ANY OF YOUR APPLICATIONS
  FOR OTHERS TO USE, or transfer the software or this agreement to any third
  party." Shipping a Windows binary linked against this CRT is on the wrong side
  of that sentence on a plain reading.
