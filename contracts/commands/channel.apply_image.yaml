# appname spec artifact — generated-from: ENGINEERING-SPEC.md Part 40 §40.4 + §10.3 selection.*/channel.* family tables
# spec-version: 5.6   artifact-schema: appname.command-package.v1   authority: artifact
# rule: a PR changing normative behavior updates the document section, this artifact,
#       its tests, and generated docs IN THE SAME PR (Appendix I).
kind: channel.apply_image
family: channel
schemaVersion: appname.command.ChannelApplyImage.v1
title: Blend a source (layer composite or channel) into the target layer/channel (§14.4)
specRef:
- §10.3
- §40.4
class: R
inverse: delta
mergeKey: null
targetResolution: 'target.layerId OR target.channelId - the write target (§10.3: targets the active layer
  or channel, §14.4); rgb source valid only against a layer target (§14.4 output table)'
lockBehavior:
  pixels: blocks
  transparency: constrains
  position: irrelevant
  all: blocks
  note: 'layer target: PIXELS/ALL block; TRANSPARENCY constrains (preserveTransparency:true applies the same
    clamp even unlocked, §14.4); channel target: none (§40.4)'
selectionBehavior: gates coverage - m(p) = mask coverage x active selection (§14.4), absent => 1
paramsSchema:
  $schema: https://json-schema.org/draft/2020-12/schema
  $id: https://appname.org/spec/command/ChannelApplyImage.v1.json
  title: appname.command.ChannelApplyImage.v1
  type: object
  required:
  - source
  properties:
    source:
      type: object
      required:
      - layer
      additionalProperties: false
      description: 'source per §10.3/§14.4: any open document of identical pixel dimensions; layer = one layer
        or ''merged'' (flattened composite); channel selector must exist for the source document''s mode'
      properties:
        docId:
          type: string
          format: uuid
          description: 'source document (default: this document); MUST be open with identical pixel dimensions
            -> error.command.size_mismatch (§14.4)'
        layer:
          oneOf:
          - type: string
            format: uuid
            pattern: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$
            description: a layerId (pattern disambiguates the oneOf for validators that do not assert format)
          - const: merged
            description: the flattened composite (§14.4)
          description: '§10.3 grammar: layer = {layerId:uuid | "merged"}'
        channel:
          default: rgb
          oneOf:
          - enum:
            - rgb
            - r
            - g
            - b
            - c
            - m
            - y
            - k
            - l
            - a
            - b_lab
            - selection
            - transparency
          - type: string
            format: uuid
            pattern: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$
            description: an alpha channel id (the §10.3 'alpha:uuid' alternative; pattern disambiguates the
              oneOf for validators that do not assert format)
          description: c/m/y/k only in CMYK, l/a/b_lab only in Lab (§14.4) -> error.command.target_kind_mismatch
    invertSource:
      type: boolean
      default: false
      description: S' = 1 - S before conditioning (§14.4)
    blend:
      default: multiply
      oneOf:
      - enum:
        - normal
        - dissolve
        - darken
        - multiply
        - colorBurn
        - linearBurn
        - darkerColor
        - lighten
        - screen
        - colorDodge
        - linearDodge
        - lighterColor
        - overlay
        - softLight
        - hardLight
        - vividLight
        - linearLight
        - pinLight
        - hardMix
        - difference
        - exclusion
        - subtract
        - divide
        - hue
        - saturation
        - color
        - luminosity
      - enum:
        - add
        description: legacy arithmetic mode existing only here (§14.4)
      description: §4.5 names + add, subtract (§10.3); 'subtract' takes the §14.4 legacy arithmetic definition
        in this command (scale/offset inside the arithmetic; see notes)
    opacity:
      type: number
      minimum: 0
      maximum: 1
      default: 1
    scale:
      type: number
      minimum: 1
      maximum: 2
      default: 1
      description: pre-blend conditioning S'' = clamp(S'/scale + offset, 0, 1); neutral at 1 (§14.4)
    offset:
      type: number
      minimum: -1
      maximum: 1
      default: 0
      description: normalized (UI displays x255 at 8-bit depth, §14.4)
    mask:
      type: object
      required:
      - source
      additionalProperties: false
      properties:
        source:
          type: object
          required:
          - layer
          additionalProperties: false
          description: mask source - validates like the main source (§40.4)
          properties:
            docId:
              type: string
              format: uuid
              description: 'source document (default: this document); MUST be open with identical pixel dimensions
                -> error.command.size_mismatch (§14.4)'
            layer:
              oneOf:
              - type: string
                format: uuid
                pattern: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$
                description: a layerId (pattern disambiguates the oneOf for validators that do not assert
                  format)
              - const: merged
                description: the flattened composite (§14.4)
              description: '§10.3 grammar: layer = {layerId:uuid | "merged"}'
            channel:
              default: rgb
              oneOf:
              - enum:
                - rgb
                - r
                - g
                - b
                - c
                - m
                - y
                - k
                - l
                - a
                - b_lab
                - selection
                - transparency
              - type: string
                format: uuid
                pattern: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$
                description: an alpha channel id (the §10.3 'alpha:uuid' alternative; pattern disambiguates
                  the oneOf for validators that do not assert format)
              description: c/m/y/k only in CMYK, l/a/b_lab only in Lab (§14.4) -> error.command.target_kind_mismatch
        invert:
          type: boolean
          default: false
      description: 'optional §14.4 mask: m(p) = mask coverage x active selection'
    preserveTransparency:
      type: boolean
      default: false
      description: clamps writes to existing alpha, exactly like the §11.1 transparency lock (§14.4)
  additionalProperties: false
defaults:
  invertSource: false
  blend: multiply
  opacity: 1
  scale: 1
  offset: 0
  preserveTransparency: false
dirtyRect: 'layer target: D = target bounds intersect selection bounds · T topic:"channels"; channel target:
  no composite D · T topic:"channels"'
events:
  history: always
  dirty: D
  tree: channels
  note: D only where composite pixels change (layer target); channel targets emit no composite D (§40.4)
historyLabel: history.channel.apply_image
actionRecording: recordable; Apply Image dialog captures committed params; cross-document sources re-resolve
  by title, else step error
scripting: appname.apply({kind:'channel.apply_image', target:{layerId:L}, params:{source:{layer:'merged', channel:'rgb'},
  blend:'multiply'}})
errors:
- error.api.*
- error.schema.missing_field
- error.command.unknown_kind
- error.schema.out_of_range
- error.schema.duplicate_id
- error.command.bad_target
- error.command.locked
- error.command.busy
- error.permission.*
- error.engine.panic
- error.engine.*
- error.command.size_mismatch
- error.command.target_kind_mismatch
tests:
  quartet: full
  unit:
  - unit_cmd_channel_apply_image_formula (§14.4 scale/offset math, add/subtract modes)
  perf:
  - GPU/CPU parity row (§34.3)
  workflow: []
examples:
  validMinimal:
    schema: appname.command.v1
    id: 00000049-0000-4000-8000-000000000001
    kind: channel.apply_image
    target:
      layerId: aaaaaaaa-0000-4000-8000-000000000001
    params:
      source:
        layer: merged
  validMaximal:
    schema: appname.command.v1
    id: 00000049-0000-4000-8000-000000000002
    kind: channel.apply_image
    target:
      layerId: aaaaaaaa-0000-4000-8000-000000000001
      maskId: null
      channelId: null
    params:
      source:
        docId: abababab-0000-4000-8000-000000000001
        layer: aaaaaaaa-0000-4000-8000-000000000002
        channel: r
      invertSource: true
      blend: add
      opacity: 0
      scale: 2
      offset: -1
      mask:
        source:
          layer: merged
          channel: cccccccc-0000-4000-8000-000000000001
        invert: true
      preserveTransparency: true
  invalid:
  - case: size-mismatch (source docId open with different pixel dimensions, §14.4)
    payload:
      schema: appname.command.v1
      id: 00000049-0000-4000-8000-000000000003
      kind: channel.apply_image
      target:
        layerId: aaaaaaaa-0000-4000-8000-000000000001
      params:
        source:
          docId: abababab-0000-4000-8000-000000000001
          layer: merged
    expectError: error.command.size_mismatch
  - case: mode-invalid-channel (channel 'c' against an RGB source document, §14.4)
    payload:
      schema: appname.command.v1
      id: 00000049-0000-4000-8000-000000000004
      kind: channel.apply_image
      target:
        layerId: aaaaaaaa-0000-4000-8000-000000000001
      params:
        source:
          layer: merged
          channel: c
    expectError: error.command.target_kind_mismatch
  - case: missing-required (no source)
    payload:
      schema: appname.command.v1
      id: 00000049-0000-4000-8000-000000000005
      kind: channel.apply_image
      target:
        layerId: aaaaaaaa-0000-4000-8000-000000000001
      params:
        blend: multiply
    expectError: error.schema.missing_field
  - case: out-of-range (scale 3 > 2)
    payload:
      schema: appname.command.v1
      id: 00000049-0000-4000-8000-000000000006
      kind: channel.apply_image
      target:
        layerId: aaaaaaaa-0000-4000-8000-000000000001
      params:
        source:
          layer: merged
        scale: 3
    expectError: error.schema.out_of_range
  - case: locked (PIXELS lock on the target layer)
    payload:
      schema: appname.command.v1
      id: 00000049-0000-4000-8000-000000000007
      kind: channel.apply_image
      target:
        layerId: aaaaaaaa-0000-4000-8000-000000000002
      params:
        source:
          layer: merged
    expectError: error.command.locked
notes:
- errors = the §40.1 baseline set (first 11 entries, reachable from every kind, stages 0-6) followed by this
  kind's entry-specific MessageIds from Part 40; wildcards (error.api.*, error.permission.*, error.engine.*)
  are Appendix H family references.
- 'tests.quartet = the four §40.1 generated suites instantiated for every kind from the registry: prop_cmd_roundtrip[kind]
  (§34.4 property 7), prop_cmd_undo[kind] (§34.4 property 9/§10.4), replay_cmd_journal[kind] (§7.8/§10.6/§7.6),
  action_cmd_roundtrip[kind] (§26.1); per-kind lists below are the extras only.'
- 'Non-finite policy (§0.3/§40.1), inlined: numeric params arriving non-finite are never a validation error
  - NaN clamps to the field''s documented default, +/-Inf to the field''s documented min/max, every clamp
  recorded in the command-validation detail; error.schema.non_finite is reachable only on the write side (journal/action
  serialization), so it is not listed under errors.'
- '§40.4 family rule, inlined: channel kinds emit T topic:"channels"; component channels are structurally
  read-only (§14.1) - kinds that would delete, duplicate in place, or reorder them fail with error.command.target_kind_mismatch.'
- 'blend value set: the 27 §4.5 wire names + ''add'' (§10.3 ''§4.5 names + add, subtract''); ''subtract''
  already exists in the §4.5 set - inside this command add/subtract take the §14.4 legacy arithmetic definitions
  (scale/offset inside the arithmetic, no S'''' step).'
- 'undo: tile deltas on the written surface (§40.4).'
- '§14.4 math, inlined: S'' = invertSource ? 1-S : S; S'''' = clamp(S''/scale + offset, 0, 1); R = lerp(T,
  B(T, S''''), opacity * m(p)); bit-identical to layer compositing with the same mode (one math library, §34).'
