# appname spec artifact — generated-from: ENGINEERING-SPEC.md Part 40 §40.3 + §10.3 layer.*/mask.* family tables
# spec-version: 5.6   artifact-schema: appname.command-package.v1   authority: artifact
# rule: a PR changing normative behavior updates the document section, this artifact,
#       its tests, and generated docs IN THE SAME PR (Appendix I).
kind: layer.distribute
family: layer
schemaVersion: appname.command.LayerDistribute.v1
title: Equalize spacing/edges across >= 3 layers
specRef:
- §10.3
- §40.3
class: R
inverse: delta
mergeKey: null
targetResolution: layer set in params.layerIds (len >= 3, stage-3 minItems; §40.3); §10.3 layer.* family target
  rule otherwise applies
lockBehavior:
  pixels: irrelevant
  transparency: irrelevant
  position: blocks
  all: blocks
  note: POSITION or ALL on any moved layer blocks (§40.3)
selectionBehavior: ignored (no selection frame exists for distribute - canvas/layers only; error.command.selection_required
  is deliberately NOT reachable, kept explicit to mirror layer.align, §40.3)
paramsSchema:
  $schema: https://json-schema.org/draft/2020-12/schema
  $id: https://appname.org/spec/command/LayerDistribute.v1.json
  title: appname.command.LayerDistribute.v1
  type: object
  required:
  - layerIds
  - mode
  properties:
    layerIds:
      type: array
      items:
        type: string
        format: uuid
      minItems: 3
      description: len >= 3 (stage-3 minItems -> error.schema.out_of_range)
    mode:
      enum:
      - left
      - h_center
      - right
      - top
      - v_center
      - bottom
      - h_gaps
      - v_gaps
      description: h_gaps/v_gaps equalize gaps, edge modes equalize edge spacing (§40.3)
  additionalProperties: false
defaults: {}
dirtyRect: D = union of bounds (before-union-after) · T topic:"tree"
events:
  history: always
  dirty: D
  tree: tree
historyLabel: history.layer.distribute
actionRecording: recordable; no dialog
scripting: appname.apply({kind:'layer.distribute', params:{layerIds:[a,b,c], mode:'h_gaps'}})
errors:
- error.api.*
- error.schema.missing_field
- error.command.unknown_kind
- error.schema.out_of_range
- error.schema.duplicate_id
- error.command.bad_target
- error.command.locked
- error.command.busy
- error.permission.*
- error.engine.panic
- error.engine.*
tests:
  quartet: full
  unit:
  - unit_cmd_layer_distribute_gap_invariant (max gap - min gap <= 1 px after run)
  workflow: []
examples:
  validMinimal:
    schema: appname.command.v1
    id: 00000028-0000-4000-8000-000000000001
    kind: layer.distribute
    params:
      layerIds:
      - aaaaaaaa-0000-4000-8000-000000000001
      - aaaaaaaa-0000-4000-8000-000000000002
      - aaaaaaaa-0000-4000-8000-000000000003
      mode: h_gaps
  validMaximal:
    schema: appname.command.v1
    id: 00000028-0000-4000-8000-000000000002
    kind: layer.distribute
    params:
      layerIds:
      - aaaaaaaa-0000-4000-8000-000000000001
      - aaaaaaaa-0000-4000-8000-000000000002
      - aaaaaaaa-0000-4000-8000-000000000003
      - ffffffff-0000-4000-8000-000000000001
      mode: v_gaps
  invalid:
  - case: out-of-range (layerIds len 2 < minItems 3)
    payload:
      schema: appname.command.v1
      id: 00000028-0000-4000-8000-000000000003
      kind: layer.distribute
      params:
        layerIds:
        - aaaaaaaa-0000-4000-8000-000000000001
        - aaaaaaaa-0000-4000-8000-000000000002
        mode: h_gaps
    expectError: error.schema.out_of_range
  - case: locked (POSITION lock on a moved layer)
    payload:
      schema: appname.command.v1
      id: 00000028-0000-4000-8000-000000000004
      kind: layer.distribute
      params:
        layerIds:
        - aaaaaaaa-0000-4000-8000-000000000001
        - aaaaaaaa-0000-4000-8000-000000000002
        - aaaaaaaa-0000-4000-8000-000000000003
        mode: left
    expectError: error.command.locked
  - case: bad-target (a member layerId does not resolve)
    payload:
      schema: appname.command.v1
      id: 00000028-0000-4000-8000-000000000005
      kind: layer.distribute
      params:
        layerIds:
        - aaaaaaaa-0000-4000-8000-000000000001
        - aaaaaaaa-0000-4000-8000-000000000002
        - 0badbad0-0000-4000-8000-00000000dead
        mode: top
    expectError: error.command.bad_target
notes:
- errors = the §40.1 baseline set (first 11 entries, reachable from every kind, stages 0-6) followed by this
  kind's entry-specific MessageIds from Part 40; wildcards (error.api.*, error.permission.*, error.engine.*)
  are Appendix H family references.
- 'tests.quartet = the four §40.1 generated suites instantiated for every kind from the registry: prop_cmd_roundtrip[kind]
  (§34.4 property 7), prop_cmd_undo[kind] (§34.4 property 9/§10.4), replay_cmd_journal[kind] (§7.8/§10.6/§7.6),
  action_cmd_roundtrip[kind] (§26.1); per-kind lists below are the extras only.'
- 'Non-finite policy (§0.3/§40.1), inlined: numeric params arriving non-finite are never a validation error
  - NaN clamps to the field''s documented default, +/-Inf to the field''s documented min/max, every clamp
  recorded in the command-validation detail; error.schema.non_finite is reachable only on the write side (journal/action
  serialization), so it is not listed under errors.'
- 'undo: SetProp transform per moved layer (integer translations) (§40.3).'
