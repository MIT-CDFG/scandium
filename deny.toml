#
# cargo-deny policy (plan §2.1 item 6; preamble rule 6). Enforced by
# scripts/gate.sh on every run.
#
# POLICY, stated for humans:
#   * External dependencies must resolve inside the permissive allowlist
#     below. GPL-family dependencies are FORBIDDEN — categorically inside the
#     Apache-licensed crates (appname-cabi, appname-py), and by this
#     allowlist everywhere in the dependency graph (workspace-internal
#     GPL-3.0-only crates are our own code, exempted via private.ignore).
#   * Every dependency addition needs a deps/ record BEFORE it lands
#     (deps/README.md). No record, no merge.
#   * LGPL/MPL externals: link, don't vendor — and they still need a record
#     and an explicit policy decision before appearing here.

[graph]
all-features = true

[licenses]
# Permissive allowlist only.
#
# "Apache-2.0 WITH LLVM-exception": GENERALIZED to the allowlist proper by
# O-BUILD 2026-08-18 with deps/wasmtime.yaml (this RATIFIES and supersedes
# the O-SCRIPT CP-0.7 wave-2 scoped exception for target-lexicon, which was
# flagged for exactly this ratification). Basis, restated: the LLVM
# exception only RELAXES Apache-2.0 (drops the §4(a)/(b)/(d) source-carriage
# conditions for object-form embedding; adds a GPLv2-combination waiver) —
# strictly more permissive than the already-allowlisted Apache-2.0; the
# exception text was read first-hand in full at the wasmtime 47.0.4 pin
# (re-read 2026-09-01 on the Q-D20 ruling; BYTE-IDENTICAL to the 47.0.3
# read across all 25 crates the move touches, with a firing control)
# (sha256-pinned in deps/wasmtime.yaml). Spec authority: §48.2 rule 2
# (ES:16985) — "`Apache-2.0 WITH LLVM-exception` (Wasmtime) is explicitly
# allowlisted." A per-crate exception list is not viable for this
# expression: 37 crates of the wasmtime resolve carry it bare (cranelift
# family, wasmtime family, regalloc2, target-lexicon, …) and wasmtime
# majors are ~monthly.
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "Unicode-DFS-2016",
]
# Workspace members are publish = false and carry our own GPL-3.0-only /
# Apache-2.0 split (DD area 4); they are not third-party deps to vet.
private = { ignore = true }

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]

