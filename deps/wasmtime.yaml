# appname build dep record — shape per bogos/deps (appname.dep-record.v1).
# CARGO dependency record (CP-1.0, plugins sandboxed tier v1): the Wasmtime
# WASM runtime + its WASI host crate, statically linked into appname-script
# behind feature `wasm-plugins`. APPROVED-UNCONSUMED: this record precedes
# the dependency (deps/README.md rule: record FIRST). No wasmtime crate is
# in any Cargo.lock in this tree today — O-SCRIPT is building the sandboxed
# host scaffolding this wave and its binding slice consumes this record.
# Like deps/ort.yaml this record deliberately renders in NO section of
# THIRD-PARTY-NOTICES.md yet (gen_notices classifies on the shipped cargo
# graph / vendoredTexts / recordKind, all inapplicable pre-landing; the
# crate notices activate mechanically when wasmtime enters the shipped
# graph — texts ship at every relevant crate root, generic scan reaches
# them, no vendoredTexts pin needed for a pure-Rust tree). Every
# record-level claim verified first-hand by O-BUILD 2026-08-18 (sealed
# .crate archives with registry-checksum match + crates.io API + raw-bytes
# LICENSE reads at the pinned tag + a sealed full-graph cargo-deny probe —
# sources inline below). Due-diligence record, not a release claim.
# ★★★★★ FRESH RECORD AT 47.0.4 — AUTHORED BY O-INT #8 ON THE OPERATOR'S
# EXPLICIT RULING (Q-D20, 2026-09-01, option (b) "you do all of it"). The
# record's own rule is that a version move is a FRESH RECORD, and O-BUILD
# owns this file in the normal case; this authorship is the exception the
# ruling created, not a precedent. THE COUNTERSIGN IS PART OF THE RULING:
# "the gate does not claim green until O-WATCH's countersign of the record
# is in the log." Until that countersign appears, this record is AUTHORED
# AND UNCOUNTERSIGNED and no green may be claimed on its strength.
# ★★★ WHY THE MOVE: RUSTSEC-2026-0268 (guest-controlled host heap
# allocation via WASIp3 streams) and RUSTSEC-2026-0269 (filesystem sandbox
# escape on trailing slashes) both name >=47.0.4 as the fix on the 47.x
# line — re-derived first-hand from `cargo deny check advisories` on
# 2026-09-01, not carried from the question that proposed it. -0269 is a
# containment boundary for the §25.3 sandbox: we fix, not waive.
name: Wasmtime (+ wasmtime-wasi WASI host)
role: >-
  WASM plugin sandbox — the §25.3 sandboxed plugin host, capability-gated:
  untrusted community plugins run capability-limited (no ambient fs or net;
  WASI with NO preopened dirs by default; per-directory grants via WASI
  preopen only after explicit user grant; denial = APPNAME_ERR_PERMISSION,
  tested behavior per §34; ABI-version mismatch rejected-not-crashed;
  sandboxed UI is declarative-only, no widget code crosses the sandbox,
  §25.4/ES:9184). Spec-side record bogos/deps/wasmtime.yaml (§48.1
  pin-table row ES:16943). Plugins mutate documents only through command
  JSON (Part 40 §40.9 x. prefix discipline) — the host is a C-ABI client
  like every front end.
