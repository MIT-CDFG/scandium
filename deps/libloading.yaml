notes: >-
  ★ CORRECTION TO THE CLOUD CENSUS, MEASURED. The census describes libloading as "already in
  Cargo.lock via wgpu, minimal diff". The first half is true; the second is misleading.
  `cargo tree -i libloading --workspace` prints "nothing to print", and the normal-dependency
  tree contains 0 occurrences (CONTROL: wgpu = 12; `cargo tree -i serde` prints a full tree, so
  the command works). Cargo.lock spans ALL targets — ash / dlib / khronos-egl / wgpu-hal pull
  libloading on Linux and Windows for Vulkan/EGL loading, NOT on macOS. So this is a NEW crate
  in the host build graph and owes this record. PRESENCE IN A LOCKFILE IS NOT PRESENCE IN A
  BUILD GRAPH.
  ★★ AND THE PORTABLE API IS NOT THE ONE TO USE. `libloading::Library::new` is documented
  (os/unix/mod.rs:119,135) as "equivalent to Library::open(filename, RTLD_LAZY | RTLD_LOCAL)".
  The code being replaced deliberately uses RTLD_NOW so "a partial/mismatched module fails at
  RawLib::load (typed) rather than at first call (crash)". A drop-in swap would DISCARD THAT
  GUARANTEE SILENTLY. The lane therefore uses the OS-specific arms — unix
  `os::unix::Library::open(Some(path), RTLD_NOW | RTLD_LOCAL)`, windows
  `os::windows::Library` (LoadLibraryW resolves imports EAGERLY by default; delay-load is
  opt-in per-import, so the target needs no equivalent flag).
