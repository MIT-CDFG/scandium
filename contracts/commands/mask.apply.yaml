# appname spec artifact — generated-from: ENGINEERING-SPEC.md Part 40 §40.3 + §10.3 layer.*/mask.* family tables
# spec-version: 5.6   artifact-schema: appname.command-package.v1   authority: artifact
# rule: a PR changing normative behavior updates the document section, this artifact,
#       its tests, and generated docs IN THE SAME PR (Appendix I).
kind: mask.apply
family: mask
schemaVersion: appname.command.MaskApply.v1
title: Bake the mask into the layer's alpha, then remove the mask node
specRef:
- §10.3
- §40.3
class: R
inverse: delta
mergeKey: null
targetResolution: target.layerId (owner) + target.maskId (the mask); both must resolve at stage 4 (§10.3 mask.*
  family rule); owning layer MUST be Raster (parametric layers cannot bake alpha; UI offers rasterize first
  per §12.4) -> error.command.target_kind_mismatch
lockBehavior:
  pixels: blocks
  transparency: blocks
  position: irrelevant
  all: blocks
  note: PIXELS or ALL block (§11.1 names mask.apply); TRANSPARENCY blocks too - baking a mask rewrites alpha
    both directions (§40.3)
selectionBehavior: ignored
paramsSchema:
  $schema: https://json-schema.org/draft/2020-12/schema
  $id: https://appname.org/spec/command/MaskApply.v1.json
  title: appname.command.MaskApply.v1
  type: object
  description: 'no params (§10.3 row: ''-''); stage 3 rejects any field (baseline: extra field -> error.schema.missing_field)'
  properties: {}
  additionalProperties: false
defaults: {}
dirtyRect: D = owning layer bounds · T topic:"tree"
events:
  history: always
  dirty: D
  tree: tree
historyLabel: history.mask.apply
actionRecording: recordable; no dialog
scripting: appname.apply({kind:'mask.apply', target:{layerId:L, maskId:M}})
errors:
- error.api.*
- error.schema.missing_field
- error.command.unknown_kind
- error.schema.out_of_range
- error.schema.duplicate_id
- error.command.bad_target
- error.command.locked
- error.command.busy
- error.permission.*
- error.engine.panic
- error.engine.*
- error.command.target_kind_mismatch
tests:
  quartet: full
  unit:
  - unit_cmd_mask_apply_coverage_math (result alpha == §11.2 formula output)
  workflow: []
examples:
  validMinimal:
    schema: appname.command.v1
    id: 00000034-0000-4000-8000-000000000001
    kind: mask.apply
    target:
      layerId: aaaaaaaa-0000-4000-8000-000000000001
      maskId: bbbbbbbb-0000-4000-8000-000000000001
  validMaximal:
    schema: appname.command.v1
    id: 00000034-0000-4000-8000-000000000002
    kind: mask.apply
    target:
      layerId: aaaaaaaa-0000-4000-8000-000000000001
      maskId: bbbbbbbb-0000-4000-8000-000000000001
      channelId: null
    params: {}
  invalid:
  - case: target-kind-mismatch (owning layer is parametric, e.g. text)
    payload:
      schema: appname.command.v1
      id: 00000034-0000-4000-8000-000000000003
      kind: mask.apply
      target:
        layerId: aaaaaaaa-0000-4000-8000-000000000003
        maskId: bbbbbbbb-0000-4000-8000-000000000001
    expectError: error.command.target_kind_mismatch
  - case: locked (TRANSPARENCY lock - baking rewrites alpha both directions)
    payload:
      schema: appname.command.v1
      id: 00000034-0000-4000-8000-000000000004
      kind: mask.apply
      target:
        layerId: aaaaaaaa-0000-4000-8000-000000000002
        maskId: bbbbbbbb-0000-4000-8000-000000000001
    expectError: error.command.locked
  - case: extra-param (the row has no params)
    payload:
      schema: appname.command.v1
      id: 00000034-0000-4000-8000-000000000005
      kind: mask.apply
      target:
        layerId: aaaaaaaa-0000-4000-8000-000000000001
        maskId: bbbbbbbb-0000-4000-8000-000000000001
      params:
        keepMask: true
    expectError: error.schema.missing_field
notes:
- errors = the §40.1 baseline set (first 11 entries, reachable from every kind, stages 0-6) followed by this
  kind's entry-specific MessageIds from Part 40; wildcards (error.api.*, error.permission.*, error.engine.*)
  are Appendix H family references.
- 'tests.quartet = the four §40.1 generated suites instantiated for every kind from the registry: prop_cmd_roundtrip[kind]
  (§34.4 property 7), prop_cmd_undo[kind] (§34.4 property 9/§10.4), replay_cmd_journal[kind] (§7.8/§10.6/§7.6),
  action_cmd_roundtrip[kind] (§26.1); per-kind lists below are the extras only.'
- 'Non-finite policy (§0.3/§40.1), inlined: numeric params arriving non-finite are never a validation error
  - NaN clamps to the field''s documented default, +/-Inf to the field''s documented min/max, every clamp
  recorded in the command-validation detail; error.schema.non_finite is reachable only on the write side (journal/action
  serialization), so it is not listed under errors.'
- 'undo: layer tile deltas (alpha multiplied in) + RemoveNode of the mask (tiles pinned) (§40.3).'
