  the closure is one TU).
obligations: >-
  Fires ON CONSUMPTION (first build that compiles Eigen headers into a
  shipped artifact — the same trigger event as libigl's): carry in
  THIRD-PARTY-NOTICES.md (1) the MPL-2.0 notice + full license text +
  the source-availability pointer (upstream URL at the elected pin);
  (2) the Apache-2.0 text + the "Copyright 2017 The TensorFlow Authors"
  line for Eigen/src/Core/arch/Default/BFloat16.h (unconditionally in
  the closure); (3) the Intel BSD-3-Clause notice ("Copyright (c) 2011,
  Intel Corporation" + the three clauses + disclaimer — its binary-form
  clause requires reproduction in distributed binaries' documentation)
  for Eigen/src/Core/util/MKL_support.h (unconditionally included,
  content-inert in our shape); (4) the headerless-file ambiguity note
  (repo-core MPL-2.0 treatment per COPYING.README, recorded not
  resolved). Consumption-shape guards land with the shim: the
  EIGEN_MPL2_ONLY define, the unsupported/ exclusion, and the absence
  of EIGEN_USE_* defines are gate-checked (grep on shim build flags +
  include closure). Not triggered by this record itself.
