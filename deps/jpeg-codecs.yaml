notes: >-
  IJG FINDING (mechanical, 2026-08-12): every mozjpeg-path option carries the
  IJG term in an AND-composite (mozjpeg "IJG"; mozjpeg-sys "IJG AND Zlib AND
  BSD-3-Clause"; jpeg-encoder "(MIT OR Apache-2.0) AND IJG"). IJG is outside
  the deny.toml permissive allowlist, the AND makes it unavoidable, and the
  proto already rejected jpeg-encoder on exactly this ground — so the plan's
  "mozjpeg or jpeg-decoder+encoder" alternative resolves to the pure-Rust
  side under current policy. No allowlist change proposed. BMP posture (plan
  "(BMP rides the image crate or own)"): the image crate (viable above) can
  carry BMP with a feature flag, or O-IO writes its own decoder — O-IO's
  call at adoption; either way the dependency surface is already covered by
  this record's viable set.
