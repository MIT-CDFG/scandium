# appname spec artifact — generated-from: ENGINEERING-SPEC.md Part 40 §40.3 + §10.3 layer.*/mask.* family tables
# spec-version: 5.6   artifact-schema: appname.command-package.v1   authority: artifact
# rule: a PR changing normative behavior updates the document section, this artifact,
#       its tests, and generated docs IN THE SAME PR (Appendix I).
kind: layer.merge_down
family: layer
schemaVersion: appname.command.LayerMergeDown.v1
title: Composite the target onto the first visible sibling below per blend math (§4.5); the result keeps the
  LOWER layer's id and name
specRef:
- §10.3
- §40.3
class: R
inverse: delta
mergeKey: null
targetResolution: target.layerId - the node acted on (§10.3 layer.* family rule); must resolve at stage 4
  (error.command.bad_target); lock resolution at stage 4 with transitive group locks, strictest wins (§11.1);
  a visible sibling below MUST exist -> error.command.bad_target (detail "nothing below to merge into")
lockBehavior:
  pixels: blocks
  transparency: irrelevant
  position: irrelevant
  all: blocks
  note: PIXELS or ALL on the lower (receiving) layer blocks; ALL on the target blocks (it is deleted) (§40.3)
selectionBehavior: ignored
paramsSchema:
  $schema: https://json-schema.org/draft/2020-12/schema
  $id: https://appname.org/spec/command/LayerMergeDown.v1.json
  title: appname.command.LayerMergeDown.v1
  type: object
  description: 'no params (§10.3 row: ''-''); stage 3 rejects any field (baseline: extra field -> error.schema.missing_field)'
  properties: {}
  additionalProperties: false
defaults: {}
dirtyRect: D = union of bounds of both nodes · T topic:"tree"
events:
  history: always
  dirty: D
  tree: tree
historyLabel: history.layer.merge_down
actionRecording: recordable; no dialog
scripting: appname.apply({kind:'layer.merge_down', target:{layerId:L}})
errors:
- error.api.*
- error.schema.missing_field
- error.command.unknown_kind
- error.schema.out_of_range
- error.schema.duplicate_id
- error.command.bad_target
- error.command.locked
- error.command.busy
- error.permission.*
- error.engine.panic
- error.engine.*
- error.command.target_kind_mismatch
tests:
  quartet: full
  unit:
  - unit_cmd_layer_merge_down_id_retention
  golden:
  - blend_modes.appname math reuse
  workflow: []
examples:
  validMinimal:
    schema: appname.command.v1
    id: 00000025-0000-4000-8000-000000000001
    kind: layer.merge_down
    target:
      layerId: aaaaaaaa-0000-4000-8000-000000000001
  validMaximal:
    schema: appname.command.v1
    id: 00000025-0000-4000-8000-000000000002
    kind: layer.merge_down
    target:
      layerId: aaaaaaaa-0000-4000-8000-000000000001
      maskId: null
      channelId: null
    params: {}
  invalid:
  - case: nothing-below (no visible sibling below the target)
    payload:
      schema: appname.command.v1
      id: 00000025-0000-4000-8000-000000000003
      kind: layer.merge_down
      target:
        layerId: aaaaaaaa-0000-4000-8000-000000000003
    expectError: error.command.bad_target
  - case: locked (PIXELS lock on the lower, receiving layer)
    payload:
      schema: appname.command.v1
      id: 00000025-0000-4000-8000-000000000004
      kind: layer.merge_down
      target:
        layerId: aaaaaaaa-0000-4000-8000-000000000002
    expectError: error.command.locked
  - case: target-kind-mismatch (unmergeable kind below, e.g. adjustment)
    payload:
      schema: appname.command.v1
      id: 00000025-0000-4000-8000-000000000005
      kind: layer.merge_down
      target:
        layerId: aaaaaaaa-0000-4000-8000-000000000001
    expectError: error.command.target_kind_mismatch
notes:
- errors = the §40.1 baseline set (first 11 entries, reachable from every kind, stages 0-6) followed by this
  kind's entry-specific MessageIds from Part 40; wildcards (error.api.*, error.permission.*, error.engine.*)
  are Appendix H family references.
- 'tests.quartet = the four §40.1 generated suites instantiated for every kind from the registry: prop_cmd_roundtrip[kind]
  (§34.4 property 7), prop_cmd_undo[kind] (§34.4 property 9/§10.4), replay_cmd_journal[kind] (§7.8/§10.6/§7.6),
  action_cmd_roundtrip[kind] (§26.1); per-kind lists below are the extras only.'
- 'Non-finite policy (§0.3/§40.1), inlined: numeric params arriving non-finite are never a validation error
  - NaN clamps to the field''s documented default, +/-Inf to the field''s documented min/max, every clamp
  recorded in the command-validation detail; error.schema.non_finite is reachable only on the write side (journal/action
  serialization), so it is not listed under errors.'
- both nodes MUST be rasterizable (parametric sources bake per §12.4); blend math per §4.5 (§40.3).
- 'undo: tile deltas on the lower layer + RemoveNode of the upper (pixels pinned).'
