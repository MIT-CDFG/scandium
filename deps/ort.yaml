linkingKind: dynamic-system
linking: 'dynamic, per the ES Part 48 row (ES:16944 "dynamic (per-platform
  EPs)"; spec-side record: "dynamic (system-loadable EPs; core CPU EP may be
  static per platform)"). RECORD-LEVEL FINDING 2 (verified first-hand from
  the sealed ort 2.0.0-rc.13 Cargo.toml, 2026-08-16): the crate DEFAULT
  feature set is [std, ndarray, tracing, download-binaries, tls-native,
  copy-dylibs, api-27] — `download-binaries` performs a BUILD-TIME NETWORK
  FETCH of prebuilt ONNX Runtime binaries (ort-sys build/download/ machinery:
  dist.tsv URL table + resolver), with `tls-native` as its TLS stack.
  BINDING POSTURE at consumption: `default-features = false` + an explicit
  feature set — `std`, an explicit pinned `api-N` (crate default is api-27;
  api-28 exists at this pin — O-ML elects and records the level at
  consumption), and `load-dynamic` (runtime dlopen via a preloaded path) or
  build-time dynamic linking against ORT_LIB_LOCATION/ORT_LIB_PATH pointing
  at a provenance-recorded libonnxruntime (both mechanisms verified present
  in ort-sys 2.0.0-rc.13 build sources). NO build of this workspace ever
  fetches binaries: reproducible-build (D-42) + SBOM correctness + offline
  hygiene consonant with D-49. GPU/vendor EP features (cuda, tensorrt,
  coreml, directml, …) enter only by a fresh record touch naming the EP
  tier (ES Part 52 column).'
