securitySource: >-
  bytecode-alliance-ghsa + rustsec-cargo-deny (spec-side record; ES:17025
  row — Bytecode Alliance advisories). Sandbox-escape-class CVE =
  Critical SLA §48.3 with the ES:17067 interim mitigation (point release
  disables sandboxed WASM plugin loading; Python trusted tier and core
